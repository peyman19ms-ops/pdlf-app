/* ---------- report ingestion for imaging + pathology (photo / PDF / pasted text -> draft -> save) ----------
   From MedicalFile. The source document is never stored. Uses geminiCall() from 60-gemini.js. */
var INGEST_PROMPTS = {
  rad: "You are reading a radiology report (ultrasound, CT, MRI, X-ray, mammography, ...). Return ONLY minified JSON: "+
    "{\"date\":string|null,\"center\":string|null,\"doctor\":string|null,\"modality\":string,\"region\":string,\"indication\":string,"+
    "\"findings\":string,\"impression\":string}. Keep the original language of the text fields. "+
    "If a Jalali date is shown return it as \"YYYY/MM/DD\". Convert Persian/Arabic digits to Western.",
  path: "You are reading a pathology report. Return ONLY minified JSON: "+
    "{\"date\":string|null,\"center\":string|null,\"doctor\":string|null,\"specimen\":string,\"clinical\":string,\"gross\":string,"+
    "\"micro\":string,\"diagnosis\":string}. Keep the original language. "+
    "If a Jalali date is shown return it as \"YYYY/MM/DD\". Convert Persian/Arabic digits to Western."
};
function jnorm(s){
  s=faDigits(String(s==null?"":s)).replace(/-/g,"/").trim();
  var m=s.match(/^(\d{3,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(m) return m[1]+"/"+p2(+m[2])+"/"+p2(+m[3]);
  var g=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);                     // gregorian slipped in
  return "";
}
function ingestExtract(kind, text, files){
  var bad=checkFiles(files); if(bad) return Promise.reject(bad);
  var parts=[]; if(text && text.trim()) parts.push({text:text.trim()});
  var fp = files && files.length ? Promise.all(Array.prototype.map.call(files,fileToPart)) : Promise.resolve([]);
  return fp.then(function(f){ return geminiCall(INGEST_PROMPTS[kind], parts.concat(f)); });
}
/* fill the matching add-form from an extracted draft, then let the user review and press Add */
function ingestFill(kind, d){
  d=d||{};
  var j=jnorm(d.date), set=function(id,v){ var el=document.getElementById(id); if(el) el.value=v==null?"":String(v); };
  if(kind==="rad"){
    set("rad-j",faDigits(j)); set("rad-center",d.center); set("rad-dr",d.doctor); set("rad-region",d.region);
    set("rad-indication",d.indication); set("rad-find",d.findings); set("rad-imp",d.impression);
    var mod=RAD_MODS.filter(function(m){ return String(d.modality||"").toLowerCase().indexOf(m[1].toLowerCase().split(" ")[0])>=0 ||
                                            String(d.modality||"").indexOf(m[0])>=0; })[0];
    document.getElementById("rad-mod").value = mod ? mod[0] : "سایر";
    fuToForm("rad",null);
    document.getElementById("rad-add").scrollIntoView({block:"center"});
  } else {
    set("path-j",faDigits(j)); set("path-center",d.center); set("path-dr",d.doctor); set("path-specimen",d.specimen);
    set("path-clin",d.clinical); set("path-gross",d.gross); set("path-micro",d.micro); set("path-diag",d.diagnosis);
    fuToForm("path",null);
    document.getElementById("path-add").scrollIntoView({block:"center"});
  }
  toast(t("مقادیر خوانده شد؛ بررسی کنید و «افزودن» را بزنید","Values read — review, then press Add"));
}

/* ================= fullscreen chart (lightweight-charts) ================= */
var _big=null;
function themeColors(){
  var cs=getComputedStyle(document.documentElement);
  return {
    ink:cs.getPropertyValue("--ink").trim()||"#15242a",
    line:cs.getPropertyValue("--line").trim()||"#d7e0e0",
    surface:cs.getPropertyValue("--surface").trim()||"#fff",
    accent:cs.getPropertyValue("--accent").trim()||"#0e7c86",
    hi:cs.getPropertyValue("--hi").trim()||"#b83227",
    lo:cs.getPropertyValue("--lo").trim()||"#2f6fb0"
  };
}
function openBig(key){
  var m=D.tests[key], pts=pointsOf(key,S);
  if(!pts.length) return;
  document.getElementById("big-title").textContent=t(m.fa,m.en);
  var bu=document.getElementById("big-unit"); bu.innerHTML=esc(dUnit(key)||"")+unitBtn(key); bindUnitBtns(bu);
  var lastP=pts[pts.length-1];
  document.getElementById("big-foot-l").textContent=
    t("آخرین","Latest")+": "+dvs(key,lastP.v)+" "+(dUnit(key)||"")+"  ·  "+lastP.j;
  document.getElementById("big-foot-r").textContent=
    (rng(key).low!=null||rng(key).high!=null)?(t("محدوده","range")+" "+rangeText(key)):"";
  var dlg=document.getElementById("big"); dlg._gen=(dlg._gen||0)+1;
  dlg.classList.remove("closing"); dlg._closing=false;
  if(dlg._closeAnim){ try{ dlg._closeAnim.cancel(); }catch(e){} dlg._closeAnim=null; }
  dlg.style.display=""; dlg.hidden=false;
  var bw=dlg.querySelector(".big-wrap"); if(bw){ bw.style.opacity=bw.style.transform=""; }
  if(!dlg.open) dlg.showModal();
  var host=document.getElementById("big-plot"); host.innerHTML="";
  // Build the chart only AFTER the open animation settles — lightweight-charts
  // sizes its canvases from the container, and a mid-animation transformed
  // ancestor leaves them stuck at the 300x150 default (blank glass panel).
  if(bw){
    var mounted=false, go=function(){ if(mounted) return; mounted=true; mountBigChart(key); };
    bw.addEventListener("animationend", go, {once:true});
    setTimeout(go, 460);
  } else {
    mountBigChart(key);
  }
}
function mountBigChart(key){
  var m=D.tests[key], pts=pointsOf(key,S);
  var host=document.getElementById("big-plot");
  if(!host || !document.getElementById("big").open) return;
  if(_big){ try{ _big.ro&&_big.ro.disconnect(); _big.chart.remove(); }catch(e){} _big=null; }
  host.innerHTML="";
  if(!window.LightweightCharts){                 // fallback: big SVG
    host.innerHTML='<div style="padding:14px">'+spark(key)+'</div>';
    var sv=host.querySelector("svg"); if(sv) sv.setAttribute("viewBox","0 0 700 320");
    return;
  }
  var C=themeColors();
  var chart=LightweightCharts.createChart(host,{
    autoSize:true,
    width: host.clientWidth||700, height: host.clientHeight||360,
    layout:{background:{color:C.surface}, textColor:C.ink, fontFamily:"inherit", attributionLogo:false},
    grid:{vertLines:{color:C.line}, horzLines:{color:C.line}},
    rightPriceScale:{borderColor:C.line},
    timeScale:{borderColor:C.line, timeVisible:false, secondsVisible:false, fixLeftEdge:true, fixRightEdge:true},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    handleScroll:true, handleScale:true,
    localization:{ locale: lang==="fa"?"fa-IR":"en" }
  });
  var s=chart.addLineSeries({color:C.accent, lineWidth:2,
    priceLineVisible:true, lastValueVisible:true,
    pointMarkersVisible:true, pointMarkersRadius:3});
  var R=rng(key);
  s.setData(pts.map(function(p){ return {time:p.g, value:dv(key,p.v)}; }));
  if(R.high!=null) s.createPriceLine({price:dv(key,R.high), color:C.hi, lineStyle:2, lineWidth:1,
    axisLabelVisible:true, title:t("حد بالا","high")});
  if(R.low!=null) s.createPriceLine({price:dv(key,R.low), color:C.lo, lineStyle:2, lineWidth:1,
    axisLabelVisible:true, title:t("حد پایین","low")});
  try{ chart.applyOptions({layout:{attributionLogo:false}}); }catch(e){}
  _big={chart:chart, series:s, key:key};
  var sizeBig=function(){
    if(!_big||!_big.chart) return;
    var w=host.clientWidth, h=host.clientHeight;
    if(w>0&&h>0){ _big.chart.resize(w,h); }
    _big.chart.timeScale().fitContent();
  };
  sizeBig(); requestAnimationFrame(sizeBig); setTimeout(sizeBig, 100);
  setRange(0);
  var killLogo=function(){ host.querySelectorAll('#tv-attr-logo,a[href*="tradingview"]').forEach(function(a){ a.remove(); }); };
  killLogo(); setTimeout(killLogo, 80); setTimeout(killLogo, 300);
  var ro=new ResizeObserver(sizeBig); ro.observe(host); _big.ro=ro;
}
function setRange(days){
  document.querySelectorAll("#big-ranges button").forEach(function(b){
    b.setAttribute("aria-pressed", (+b.getAttribute("data-r"))===days);
  });
  if(!_big||!_big.chart) return;
  if(!days){ _big.chart.timeScale().fitContent(); return; }
  var pts=pointsOf(_big.key,S), last=pts[pts.length-1];
  var to=new Date(last.g+"T00:00:00"), from=new Date(to.getTime()-days*86400000);
  _big.chart.timeScale().setVisibleRange({from:from.toISOString().slice(0,10), to:last.g});
}
function closeBig(){
  if(_big){ try{ _big.ro&&_big.ro.disconnect(); _big.chart.remove(); }catch(e){} _big=null; }
  document.getElementById("big-plot").innerHTML="";
}
document.getElementById("big").addEventListener("close", closeBig);
function shutBig(){                                  // WAAPI close (reliable in WebView2), then hard-hide
  var d=document.getElementById("big");
  if(d._closing) return;
  var gen=d._gen=(d._gen||0)+1;                       // invalidated if openBig() reopens before hide() runs
  var wrap=d.querySelector(".big-wrap");
  var done=false, hide=function(){
    if(done || d._gen!==gen) return; done=true; d._closing=false;
    d.classList.remove("closing");
    try{ d.close(); }catch(e){}
    try{ d.open=false; }catch(e){}
    d.removeAttribute("open"); d.style.display="none";
    if(wrap) wrap.style.opacity=wrap.style.transform="";
    setTimeout(closeBig,0);                          // defer chart teardown off the animation frame
  };
  if(!d.open && d.style.display==="none"){ hide(); return; }
  d._closing=true; d.classList.add("closing");
  var a=null, reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  try{
    if(!reduce) a=wrap.animate(
      [{opacity:1, transform:"translateY(0) scale(1)"},
       {opacity:0, transform:"translateY(24px) scale(.94)"}],
      {duration:270, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
  }catch(e){}
  d._closeAnim=a;
  if(a){ a.onfinish=hide; a.oncancel=hide; setTimeout(hide,420); }
  else { hide(); }
}

/* ================= backup / restore =================
   v3 format. One patient:  {v:3,pid,patient:{identity},additions,notes,nextTest,radiology,meds}
   All patients:           {v:3,all:true,patients:[{patient,additions,notes,nextTest,radiology,meds}]}
   Restoring recreates patients added in the app (identity incl. name + national ID). */
function cloneDef(d){ return JSON.parse(JSON.stringify(d)); }
function readPatientData(pid){
  var o={}; USER_SLICES.forEach(function(x){ o[x.k]=jget("lab."+pid+"."+x.ls, cloneDef(x.def)); }); return o;
}
function blockOf(p){ var d=readPatientData(p.id); d.patient=identityOf(p); return d; }
function allBackupJson(){
  return JSON.stringify({ v:3, all:true, exportedAt:new Date().toISOString(), patients:PATIENTS.map(blockOf) }, null, 1);
}
/* write the data slices of one block into storage; slices missing from the block are left alone */
function writeSlices(id,b){
  USER_SLICES.forEach(function(x){
    if(!(x.k in b)) return;
    var v=b[x.k]; if(v==null) v=cloneDef(x.def);
    LS.set("lab."+id+"."+x.ls, JSON.stringify(v));
  });
}
/* write one patient block into storage (and the roster when the identity is new/changed) */
function applyPatientBlock(b){
  var id=b.patient&&b.patient.id; if(!id) return false;
  var known=false; BAKED.forEach(function(x){ if(x.id===id) known=true; });
  if(known){ meta[id]={}; IDENT.forEach(function(f){ if(b.patient[f]!=null) meta[id][f]=b.patient[f]; }); }
  else if(D.adminBuild){
    custom=custom.filter(function(c){ return c.id!==id; });
    custom.push({id:id, fa:b.patient.fa, en:b.patient.en, nationalId:b.patient.nationalId||"", sex:b.patient.sex||"",
      birth:b.patient.birth||"", role:b.patient.role||{fa:"",en:""}, bloodType:b.patient.bloodType||"", phone:b.patient.phone||""});
  } else return false;
  writeSlices(id,b);
  return true;
}
function importAll(d){
  var n=0; (d.patients||[]).forEach(function(b){ if(applyPatientBlock(b)) n++; });
  saveRoster();
  usePatient(pidValid(PID)?PID:PATIENTS[0].id);
  S=buildReports(); fillTestSelect(); renderAll();
  return n;
}

  var blk = Array.isArray(d) ? {additions:d} : d;

/* ---------- import from MedicalFile (its JSON export: {v:1, slices:{...}}) ---------- */
function findCustomByName(name, unit){
  var n=name.trim().toLowerCase(), u=PLF.units.norm(unit||"");
  return customTests.filter(function(c){ return (c.fa||"").trim().toLowerCase()===n || (c.en||"").trim().toLowerCase()===n; })
    .filter(function(c){ return PLF.units.norm(c.unit||"")===u; })[0];
}
function importMedicalFile(env){
  var m=PLF.mf.mapRecords(env), pr=m.profile, target=null, created=false;
  var nid=PLF.nid.norm(pr.nationalId);
  if(nid && PLF.nid.valid(nid)) target=PATIENTS.filter(function(p){ return p.nationalId && PLF.nid.norm(p.nationalId)===nid; })[0]||null;
  if(target){
    if(!confirm(t("این فایل به «"+t(target.fa,target.en)+"» (کد ملی یکسان) اضافه شود؟","Merge this file into “"+t(target.fa,target.en)+"” (same national ID)?"))) return false;
  } else if(D.adminBuild && pr.name){
    if(confirm(t("بیمار جدید «"+pr.name+"» ساخته شود؟ (انصراف = افزودن به بیمار فعلی)","Create new patient “"+pr.name+"”? (Cancel = add to the current patient)"))){
      var id="p"+Date.now().toString(36);
      custom.push({id:id, fa:pr.name, en:pr.name, nationalId:(nid&&PLF.nid.valid(nid))?nid:"", sex:pr.sex, birth:pr.birth,
        role:{fa:"",en:""}, bloodType:pr.bloodType, phone:pr.phone});
      saveRoster(); target=PATIENTS.filter(function(p){ return p.id===id; })[0]; created=true;
    }
  }
  if(!target){
    target=curPatient();
    if(!confirm(t("داده‌ها به «"+t(target.fa,target.en)+"» اضافه شود؟","Add the data to “"+t(target.fa,target.en)+"”?"))) return false;
  }
  if(target.id!==PID) usePatient(target.id);
  var n={conditions:0, allergies:0, radiology:0, pathology:0, values:0, tests:0};
  if(m.history && history_.indexOf(m.history)<0){ history_=(history_?history_+"\n\n":"")+m.history; }
  m.conditions.forEach(function(c){ if(!conditions.some(function(x){ return x.label===c.label && x.since===c.since; })){ conditions.push(c); n.conditions++; } });
  m.allergies.forEach(function(a){ if(!allergies.some(function(x){ return x.agent===a.agent && x.kind===a.kind; })){ allergies.push(a); n.allergies++; } });
  m.radiology.forEach(function(r){ PLF.followup.apply(r, r.impression); if(!radAdds.some(function(x){ return x.id===r.id; })){ radAdds.push(r); n.radiology++; } });
  m.pathology.forEach(function(r){ PLF.followup.apply(r, r.diagnosis); if(!pathAdds.some(function(x){ return x.id===r.id; })){ pathAdds.push(r); n.pathology++; } });
  m.labs.forEach(function(rep){
    if(!rep.g) return;
    rep.analytes.forEach(function(a){
      var name=String(a.name).trim(), v=+a.value, key=matchKey("",name), val=null;
      if(key){
        var mt=D.tests[key];
        if(!a.unit || PLF.units.isStd(mt,a.unit)) val=v;
        else { var cv=convertExtracted(a.unit,key,v); if(cv) val=cv.val; }
      }
      if(val==null){                                       // unknown analyte / unit -> dynamic test
        var c=findCustomByName(name,a.unit);
        if(c) key=c.key; else { key=createCustomTest({fa:name,en:name,unit:a.unit||"",low:a.refLow,high:a.refHigh}); n.tests++; }
        val=v;
      }
      if(!additions.some(function(x){ return x.key===key && x.g===rep.g && x.val===val; })){
        additions.push({j:rep.j, g:rep.g, key:key, val:val, src:"medicalfile"}); n.values++;
      }
    });
  });
  ["history","conditions","allergies","radiology","pathology","additions","customTests"].forEach(saveSlice);
  saveRad();
  S=buildReports(); fillTestSelect(); renderAll();
  toast(t("از MedicalFile وارد شد: "+n.values+" مقدار، "+n.radiology+" تصویربرداری، "+n.pathology+" پاتولوژی، "+n.conditions+" بیماری",
          "Imported from MedicalFile: "+n.values+" values, "+n.radiology+" imaging, "+n.pathology+" pathology, "+n.conditions+" conditions")
        +(created?"":""));
  return true;
}

    if(!PLF.mf.valid(env)){ alert(t("این فایل خروجی MedicalFile نیست","This is not a MedicalFile export")); return; }

/* ripple feedback on any .tap element, even ones with no click handler (per user request) */
document.addEventListener("pointerdown",function(e){
  var el=e.target.closest(".tap"); if(!el) return;
  var r=el.getBoundingClientRect();
  var d=Math.max(r.width,r.height)*1.6;
  var s=document.createElement("span"); s.className="ripple";
  s.style.width=s.style.height=d+"px";
  s.style.left=(e.clientX-r.left-d/2)+"px"; s.style.top=(e.clientY-r.top-d/2)+"px";
  el.appendChild(s); setTimeout(function(){ s.remove(); },520);
},{passive:true});
/* stagger the entrance of panels / widgets so they cascade in rather than pop together */
function staggerIn(root,selector,stepMs){
  (root||document).querySelectorAll(selector).forEach(function(el,i){
    el.style.animationDelay=(i*(stepMs||45))+"ms";
  });
}
