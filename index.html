  --accent:#66c6d2; --accent-2:#93dbe3; --on-accent:#0c2a2e;
  --hi:#ec7a6d; --lo:#7cb0e4; --ok:#63c795;
  --hi-bg:rgba(236,122,109,.15); --lo-bg:rgba(124,176,228,.15);
  --band:rgba(102,198,210,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.34), 0 20px 44px rgba(0,0,0,.30);
  --shadow-lg:0 14px 32px rgba(0,0,0,.42), 0 44px 100px rgba(0,0,0,.5);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --edge:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 0 1px rgba(255,255,255,.02);
  --head-sh:0 8px 26px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#1a1d22; --surface:#24282f; --surface-2:#2c313a; --surface-3:#363c47;
  --ink:#e9ebef; --muted:#9aa3af; --line:rgba(255,255,255,.055);
  --accent:#66c6d2; --accent-2:#93dbe3; --on-accent:#0c2a2e;
  --hi:#ec7a6d; --lo:#7cb0e4; --ok:#63c795;
  --hi-bg:rgba(236,122,109,.15); --lo-bg:rgba(124,176,228,.15);
  --band:rgba(102,198,210,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.34), 0 20px 44px rgba(0,0,0,.30);
  --shadow-lg:0 14px 32px rgba(0,0,0,.42), 0 44px 100px rgba(0,0,0,.5);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --edge:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 0 1px rgba(255,255,255,.02);
  --head-sh:0 8px 26px rgba(0,0,0,.4);
}
:root[data-fs="lg"]{font-size:17.5px}
:root[data-fs="xl"]{font-size:19.5px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,-apple-system,"Iranian Sans",sans-serif;
  font-size:.95rem; line-height:1.6;
}
.mono,.src,textarea.io{font-family:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace}
h1,h2,h3{margin:0; font-weight:700; text-wrap:balance; line-height:1.3}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* tactile feedback on anything interactive */
.tap{transition:transform .08s ease, background .12s ease, box-shadow .12s ease; -webkit-tap-highlight-color:transparent}
.tap:active{transform:scale(.97)}

/* ---- top bar ---- */
.head{position:sticky; top:0; z-index:30; background:var(--surface)}
.top{
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
  padding:12px clamp(12px,3vw,28px);
}
.brand{display:flex; flex-direction:column; gap:2px; margin-inline-end:auto; min-width:0}
.brand h1{font-size:clamp(1.02rem,1rem + .6vw,1.3rem); letter-spacing:-.01em}
.brand .sub{font-size:.8rem; color:var(--muted)}
.ppick{
  font:inherit; font-size:clamp(1.02rem,1rem + .6vw,1.3rem); font-weight:700; letter-spacing:-.01em;
  color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
  border-radius:9px; padding:3px 26px 3px 10px; max-width:100%; cursor:pointer;
  -webkit-appearance:none; appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) center,calc(100% - 9px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
html[dir="rtl"] .ppick{padding:3px 10px 3px 26px; background-position:14px center,19px center}
.ppick:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font-size:.76rem; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap;
}
.chip b{color:var(--ink); font-weight:600}
.btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  border-radius:9px; padding:7px 12px; font-size:.82rem; cursor:pointer; font-weight:500;
  transition:background .12s,border-color .12s;
}
.btn:hover{border-color:var(--accent); background:var(--surface-3)}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:transparent}
.btn.sm{padding:4px 9px; font-size:.76rem}

/* ---- tabs ---- */
.tabs{
  background:var(--surface);
  display:flex; gap:2px; padding:6px clamp(12px,3vw,28px) 0; border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:none; background:transparent; color:var(--muted); cursor:pointer; flex:0 0 auto;
  padding:9px 14px; font-size:.86rem; font-weight:600; border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

main{padding:clamp(14px,3vw,26px); max-width:1400px; margin:0 auto}
.panel{display:none}
.panel.on{display:block}
.hint{color:var(--muted); font-size:.84rem; margin:0 0 14px}

/* ---- toolbar ---- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:12px}
.search{
  flex:1 1 200px; max-width:320px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); border-radius:9px; padding:8px 12px; font:inherit; font-size:.86rem;
}
.check{display:flex; align-items:center; gap:6px; font-size:.82rem; color:var(--muted); cursor:pointer}
.check input{accent-color:var(--accent); width:15px; height:15px}
.legend{display:flex; gap:12px; font-size:.76rem; color:var(--muted); margin-inline-start:auto}
.legend span{display:flex; align-items:center; gap:5px}
.sw{width:11px; height:11px; border-radius:3px; display:inline-block}
.sw.hi{background:var(--hi-bg); border:1px solid var(--hi)}
.sw.lo{background:var(--lo-bg); border:1px solid var(--lo)}

/* ---- table ---- */
.tablewrap{
  overflow:auto; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); box-shadow:var(--shadow);
  max-height:76vh; max-height:calc(100dvh - 220px);
}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:.84rem}
th,td{padding:7px 10px; text-align:center; white-space:nowrap}
thead th{
  position:sticky; top:0; z-index:5; background:var(--surface-2);
  border-bottom:1px solid var(--line); font-weight:600; color:var(--ink);
}
thead th .g{display:block; font-size:.68rem; color:var(--muted); font-weight:400}
tbody th.rowhead, thead th.corner{
  position:sticky; inset-inline-start:0; z-index:6; background:var(--surface);
  text-align:start; border-inline-end:1px solid var(--line); min-width:190px; max-width:230px;
  white-space:normal;
}
thead th.corner{z-index:7; background:var(--surface-2)}
tbody th.rowhead .tn{font-weight:600; display:block}
tbody th.rowhead .rr{font-size:.7rem; color:var(--muted); font-weight:400}
tbody tr:hover td, tbody tr:hover th.rowhead{background:var(--surface-2)}
td{border-bottom:1px solid var(--line); color:var(--ink)}
td.v{font-variant-numeric:tabular-nums}
td.hi{background:var(--hi-bg); color:var(--hi); font-weight:600}
td.lo{background:var(--lo-bg); color:var(--lo); font-weight:600}
td.empty{color:var(--line)}
td.ovr{position:relative}
td.ovr::after{content:""; position:absolute; top:2px; inset-inline-end:2px;
  border-width:4px 4px 0 0; border-style:solid; border-color:var(--accent) transparent transparent transparent}
tr.cat th{
  position:sticky; inset-inline-start:0;
  background:var(--surface-3); text-align:start; font-size:.78rem; font-weight:700;
  letter-spacing:.02em; color:var(--muted); cursor:pointer; text-transform:uppercase;
}
tr.cat th .cnt{font-weight:400; text-transform:none}
tr.cat.collapsed th::after{content:"▸"; float:inline-end; opacity:.6}
tr.cat th::after{content:"▾"; float:inline-end; opacity:.6}

/* ---- charts ---- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr)); gap:14px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 12px 8px; box-shadow:var(--shadow);
}
.card h3{font-size:.86rem; display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.card h3 .u{font-size:.7rem; color:var(--muted); font-weight:400}
.card .last{font-size:.78rem; color:var(--muted); margin:2px 0 4px}
.card .last b{font-size:1rem; color:var(--ink); font-variant-numeric:tabular-nums}
.card svg{width:100%; height:auto; display:block; overflow:visible}
.pickrow{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.pickrow select{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:9px; padding:8px 12px; font:inherit; font-size:.84rem;
}

/* ---- pathology ---- */
.report{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow); max-width:70ch; margin-bottom:14px;
}
.report .meta{font-size:.78rem; color:var(--muted); margin-bottom:8px}
.report h3{font-size:.98rem; margin-bottom:6px}
.report .dx{
  margin:10px 0; padding:8px 12px; border-inline-start:3px solid var(--ok);
  background:var(--surface-2); border-radius:0 8px 8px 0; font-weight:600;
}
.report p{margin:6px 0; font-size:.88rem}
.report .k{color:var(--muted)}

/* ---- add / data ---- */
.form{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow); max-width:640px; margin-bottom:16px;
}
.form .row{display:flex; flex-wrap:wrap; gap:10px 14px; margin-bottom:10px}
.field{display:flex; flex-direction:column; gap:4px; flex:1 1 140px}
.field label{font-size:.76rem; color:var(--muted)}
.field input,.field select{
  border:1px solid var(--line); background:var(--ground); color:var(--ink);
  border-radius:8px; padding:8px 10px; font:inherit; font-size:.86rem;
}
.mine{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:6px}
.mine li{
  display:flex; align-items:center; gap:10px; font-size:.82rem;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px;
}
.mine li .num{margin-inline-start:auto}
textarea.io{
  width:100%; min-height:120px; border:1px solid var(--line); background:var(--ground);
  color:var(--ink); border-radius:9px; padding:10px; font-family:ui-monospace,Consolas,monospace;
  font-size:.78rem; line-height:1.5; resize:vertical;
}
.src{font-family:ui-monospace,Consolas,monospace; font-size:.76rem; color:var(--muted)}
.src table{width:auto; font-size:.76rem}
.src td,.src th{text-align:start; padding:4px 12px 4px 0; white-space:normal; border:none}
.src td:first-child{color:var(--accent-2); font-weight:500}
.warn{
  font-size:.82rem; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-inline-start:3px solid var(--accent);
  border-radius:0 8px 8px 0; padding:10px 14px; margin:14px 0; max-width:70ch;
}
.fh{font-size:.92rem; margin-bottom:8px}
.form .btn{flex:0 0 auto}
.fwide{display:flex; flex-direction:column; gap:4px; margin-bottom:10px}
.fwide .flbl{font-size:.76rem; color:var(--muted)}
.fwide textarea{
  border:1px solid var(--line); background:var(--ground); color:var(--ink);
  border-radius:8px; padding:8px 10px; font:inherit; font-size:.86rem; line-height:1.6; resize:vertical;
}
/* imaging cards reuse .report; medication rows */
.med{
  display:flex; flex-direction:column; gap:2px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; box-shadow:var(--shadow); margin-bottom:10px;
}
.med.off{opacity:.6}
.med .mh{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.med .mh b{font-size:1rem}
.med .mh .dose{color:var(--accent-2); font-size:.86rem}
.med .mh .badge{
  font-size:.68rem; padding:1px 7px; border-radius:20px; margin-inline-start:auto;
  background:color-mix(in srgb, var(--ok) 22%, transparent); color:var(--ok);
}
.med .mh .badge.off{background:var(--surface-2); color:var(--muted)}
.med .msub{font-size:.8rem; color:var(--muted)}
.med .mact{display:flex; gap:8px; margin-top:6px}
.med .mact button{
  font:inherit; font-size:.76rem; padding:3px 10px; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
}
.rad-del,.med .mact .del{color:var(--hi)}

/* ---- overview ---- */
.minsel{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:9px; padding:6px 10px; font:inherit; font-size:.8rem;
}
.sumhead{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-start; margin-bottom:14px}
.sumhead-actions{margin-inline-start:auto}
.nextcard{
  background:var(--surface); border:1px solid var(--line); border-inline-start:3px solid var(--accent);
  border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:16px; font-size:.86rem;
  box-shadow:var(--shadow);
}
.nextcard b{color:var(--accent-2)}
.chipwrap{display:flex; flex-wrap:wrap; gap:8px}
.attn-chip{
  display:flex; align-items:baseline; gap:8px; padding:8px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); font-size:.84rem;
}
.attn-chip .v{font-weight:700; font-variant-numeric:tabular-nums}
.attn-chip.hi{border-color:var(--hi); background:var(--hi-bg)}
.attn-chip.hi .v{color:var(--hi)}
.attn-chip.lo{border-color:var(--lo); background:var(--lo-bg)}
.attn-chip.lo .v{color:var(--lo)}
.attn-chip .rr{color:var(--muted); font-size:.74rem}
.ok-msg{color:var(--ok); font-size:.86rem}
.keygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px}
.keycard{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  box-shadow:var(--shadow); cursor:pointer;
}
.keycard .kn{font-size:.76rem; color:var(--muted); display:block; margin-bottom:3px}
.keycard .kv{font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums}
.keycard .kv.hi{color:var(--hi)} .keycard .kv.lo{color:var(--lo)}
.keycard .kt{font-size:.74rem; color:var(--muted); margin-inline-start:4px}
.keycard.worse{border-color:var(--hi)}
.keycard .worn{display:block; margin-top:4px; font-size:.7rem; color:var(--hi)}
.trend{font-size:.8rem; margin-inline-start:4px}
.trend.up{color:var(--hi)} .trend.down{color:var(--lo)} .trend.flat{color:var(--muted)}
.trend.good{color:var(--ok)}

/* ---- collapsible section / panel bar ---- */
.sect{margin:14px 0; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); box-shadow:var(--shadow); overflow:hidden}
.sect-bar{
  display:flex; align-items:center; gap:10px; width:100%; text-align:start;
  background:transparent; border:none; color:var(--ink); cursor:pointer;
  padding:13px 15px; font-size:1rem; font-weight:700;
}
.sect-bar:hover{background:var(--surface-2)}
.sect-bar .chev{
  margin-inline-start:auto; color:var(--accent); font-size:.9rem;
  transition:transform .22s ease; flex:0 0 auto;
}
.sect[data-open="1"] > .sect-bar .chev{transform:rotate(90deg)}
.sect-bar .cnt{font-weight:400; color:var(--muted); font-size:.82rem}
.sect-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--hi);flex:0 0 auto}
.sect-body{
  display:grid; grid-template-rows:0fr; transition:grid-template-rows .24s ease;
}
.sect[data-open="1"] > .sect-body{grid-template-rows:1fr}
.sect-body > .sect-inner{overflow:hidden; min-height:0}
.sect[data-open="1"] > .sect-body > .sect-inner{padding:4px 12px 12px}

/* ---- widget rows: number card + chart card ---- */
.panel-sect{margin:12px 0}
.panel-sect > .widgets{padding:2px 12px 12px}
.panel-sect .sect-bar{padding-block:11px}
.widgets{display:flex; flex-direction:column; gap:10px}
/* extra panel rows: roll open/closed under the first three, no full re-render */
.xrows{display:grid; grid-template-rows:0fr; opacity:.001;
  transition:grid-template-rows .34s cubic-bezier(.22,.9,.35,1), opacity .3s ease;}
.xrows > .xrows-in{overflow:hidden; display:flex; flex-direction:column; gap:10px}
.xrows.open{grid-template-rows:1fr; opacity:1}
.wrow{
  display:grid; grid-template-columns:minmax(112px,124px) 1fr; gap:10px; align-items:stretch;
}
.wnum, .wchart{
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px; cursor:pointer;
}
.wnum{display:flex; flex-direction:column; justify-content:center; text-align:start; padding:10px 12px}
.wnum .kn{font-size:.74rem; color:var(--muted); line-height:1.25; margin-bottom:4px}
.wnum .kv{font-size:1.4rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05}
.wnum .kv.hi{color:var(--hi)} .wnum .kv.lo{color:var(--lo)}
.wnum .ku{font-size:.62rem; color:var(--muted); font-weight:500}
.wnum .kd{font-size:.74rem; margin-top:4px}
.wnum.worse{border-color:var(--hi); box-shadow:inset 0 0 0 1px var(--hi)}
.wchart{position:relative; display:flex; align-items:center; padding:6px 10px; height:96px; overflow:hidden}
.wchart svg{width:100%; height:80px; display:block}
.wchart .expand{
  position:absolute; inset-block-start:6px; inset-inline-end:9px;
  font-size:.9rem; color:var(--muted); opacity:.55;
}
.wchart:hover .expand{opacity:1; color:var(--accent)}
@media (max-width:430px){
  .wrow{grid-template-columns:minmax(100px,108px) 1fr; gap:8px}
  .wnum .kv{font-size:1.25rem}
  .wchart{height:88px} .wchart svg{height:72px}
}

/* ---- fullscreen chart dialog ---- */
/* the <dialog> is just a transparent frame; .big-wrap carries the surface,
   radius, shadow AND all the open/close motion (animating the inner div is
   far smoother in WebView2 than animating <dialog> itself). */
dialog#big{
  border:none; padding:0; width:min(960px,100vw); height:min(92vh,720px);
  max-width:100vw; max-height:100vh; overflow:visible;
  background:transparent; color:var(--ink); box-shadow:none;
}
dialog#big::backdrop{background:rgba(8,16,18,.6)}
.big-wrap{
  display:flex; flex-direction:column; height:100%;
  background:var(--surface); border-radius:14px; overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.45);
}
.big-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.big-head h3{font-size:1.05rem}
.big-head .u{color:var(--muted); font-size:.82rem}
.big-head .ranges{display:flex; gap:6px; margin-inline-start:auto}
.big-head .ranges button, .big-x{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  border-radius:8px; padding:5px 11px; font:inherit; font-size:.82rem; cursor:pointer;
}
.big-head .ranges button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:transparent}
#big-plot{flex:1; min-height:0}
#big-plot #tv-attr-logo,#big-plot a[href*="tradingview"]{display:none !important}
.big-foot{padding:8px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:.78rem;
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px}

/* ---- tools menu chips in header ---- */
.hbtns{display:flex; gap:6px; align-items:center}
.iconbtn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  border-radius:9px; padding:6px 10px; font-size:.8rem; cursor:pointer; font-weight:600;
}
.iconbtn:hover{border-color:var(--accent)}
tbody th.rowhead .badge{
  display:inline-block; margin-inline-start:4px; font-size:.62rem; font-weight:700;
  color:var(--on-accent); background:var(--hi); border-radius:5px; padding:0 4px;
}
thead th.hasnote{cursor:pointer}
thead th .notedot{color:var(--accent-2); font-size:.7rem}

/* ---- print / doctor export ---- */
#printview{
  display:none; background:#fff; color:#111; padding:22px 26px; font-size:12px;
  --hi:#a11; --lo:#134a86; --ok:#178a4e; --muted:#666; --accent:#0e7c86;
  --band:rgba(14,124,134,.12); --surface:#fff;
}
#printview h1{font-size:18px; margin:0 0 2px}
#printview .pmeta{color:#555; font-size:11px; margin-bottom:14px}
#printview table{border-collapse:collapse; width:100%; margin-bottom:18px}

/* ===== borderless + elevation redesign (graphite / titanium) ===== */
.head{border-bottom:none; box-shadow:var(--head-sh)}
.top{border-bottom:none}
.tabs{border-bottom:none; background:transparent; padding-bottom:2px}
.sect,.card,.form,.report,.tablewrap,.wnum,.wchart,.keycard,.nextcard,.revbox,.big-wrap{
  border:none !important;
  box-shadow:var(--shadow), var(--edge);
  transition:box-shadow .18s ease, transform .12s ease, background .18s ease;
}
.wchart:hover,.wnum:hover,.card:hover,.keycard:hover{
  box-shadow:var(--shadow-lg), var(--edge); transform:translateY(-2px);
}
.tap:active,.wnum:active,.wchart:active,.keycard:active,.card:active,.sect-bar:active{
  box-shadow:var(--shadow-sm), var(--edge); transform:scale(.985);
}
.sect-bar:hover{background:var(--surface-2); border-radius:var(--radius) var(--radius) 0 0}
.attn-chip{border:none !important; box-shadow:var(--shadow-sm), var(--edge)}
.attn-chip.hi{box-shadow:var(--shadow-sm), var(--edge), inset 0 0 0 1.5px var(--hi)}
.attn-chip.lo{box-shadow:var(--shadow-sm), var(--edge), inset 0 0 0 1.5px var(--lo)}
.wnum.worse{box-shadow:var(--shadow), var(--edge), inset 0 0 0 1.5px var(--hi) !important}
.btn,.iconbtn{border:none; box-shadow:var(--shadow-sm)}
.btn:hover,.iconbtn:hover{box-shadow:var(--shadow); transform:translateY(-1px)}
.btn.primary{box-shadow:0 3px 14px rgba(14,124,134,.4)}
.btn.sm{box-shadow:var(--shadow-sm)}
.minsel,.search,.field input,.field select,textarea.io,#gm,#f-test,.revrow select,.revrow input,.fwide textarea{
  border:1px solid var(--line) !important; box-shadow:inset 0 1px 3px rgba(0,0,0,.05);
  background:var(--surface-2) !important;

/* table: swap hairlines for zebra + elevation */
td,thead th{border-bottom:none !important}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody th.rowhead,thead th.corner{

.big-head{border-bottom:none; box-shadow:0 10px 20px -14px rgba(0,0,0,.5)}
.big-foot{border-top:none; box-shadow:0 -10px 20px -14px rgba(0,0,0,.4)}

.titlebar .tb-btns button{

  font-size:.85rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .12s ease, color .12s ease;

html[data-shell="tauri"] body{background:transparent}

html[data-shell="tauri"] .top{background:transparent}
html[data-shell="tauri"] .tabs{background:transparent}

html[data-shell="tauri"] .keycard,html[data-shell="tauri"] .nextcard,html[data-shell="tauri"] .revbox,

  -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5);
}
/* the fullscreen chart panel stays SOLID — the glass treatment made it near-invisible
   over the dimmed backdrop in WebView2. The window's own Mica still shows around it. */
html[data-shell="tauri"] .big-wrap{ background:var(--surface) !important; }
html[data-shell="tauri"] .attn-chip{
  background:color-mix(in srgb, var(--surface) 70%, transparent) !important;

/* ===== motion: entrance, ripple, dialog transitions ===== */
@keyframes lc-in{ from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none} }
.panel-sect{animation:lc-in .38s cubic-bezier(.22,.9,.35,1) both}
.wrow{animation:lc-in .34s cubic-bezier(.22,.9,.35,1) both}
.attn-chip{animation:lc-in .3s cubic-bezier(.22,.9,.35,1) both}
dialog#rev[open]{animation:lc-pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes lc-pop{ from{opacity:0; transform:scale(.94) translateY(6px)} to{opacity:1; transform:none} }
dialog#rev::backdrop{animation:lc-fade .2s ease both}
@keyframes lc-fade{ from{opacity:0} to{opacity:1} }

/* fullscreen chart — motion lives on the inner .big-wrap, not the <dialog>.
   Open = keyframe (expo-out rise+fade). Close = a real CSS transition on
   .big-wrap (fires transitionend reliably in WebView2); animation:none stops
   the filled open-keyframe from overriding it. */
.big-wrap{ transform-origin:50% 44% }
dialog#big[open] > .big-wrap{ animation:big-open .40s cubic-bezier(.16,1,.3,1) both }
@keyframes big-open{ from{opacity:0; transform:translateY(28px) scale(.93)} to{opacity:1; transform:translateY(0) scale(1)} }
/* close motion is driven by the Web Animations API in shutBig() (rock-solid in WebView2);
   this just stops the filled open-keyframe from fighting it */
dialog#big.closing > .big-wrap{ animation:none }
dialog#big.closing{ pointer-events:none }
dialog#big::backdrop{ -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); animation:big-bd-in .32s ease both }
dialog#big.closing::backdrop{
  animation:none; opacity:0; transition:opacity .26s ease;
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
@keyframes big-bd-in{ from{opacity:0} to{opacity:1} }
.ripple{position:absolute; border-radius:50%; background:currentColor; opacity:.22; transform:scale(0);
  animation:lc-ripple .5s ease-out forwards; pointer-events:none}
@keyframes lc-ripple{ to{transform:scale(2.6); opacity:0} }
.tap{position:relative; overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .panel-sect,.wrow,.attn-chip,dialog#rev[open],dialog#rev::backdrop,dialog#big::backdrop,dialog#big[open] > .big-wrap,dialog#big.closing > .big-wrap,dialog#big.closing::backdrop{animation:none !important}
  .xrows,dialog#big.closing > .big-wrap,dialog#big.closing::backdrop{transition:none !important}
  .ripple{display:none}
}

/* ===== Lab health score: neumorphic card + plum-red ring ===== */
:root{
  --plum-hi:#c04a7c; --plum:#8e2a52; --plum-lo:#5c1631;
  --nm-hi:rgba(255,255,255,.95); --nm-lo:rgba(150,165,185,.55);
  --nm-in-hi:rgba(255,255,255,.9); --nm-in-lo:rgba(150,165,185,.6);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --plum-hi:#e0709f; --plum:#b04577; --plum-lo:#7a2450;
  --nm-hi:rgba(255,255,255,.045); --nm-lo:rgba(0,0,0,.55); --nm-in-hi:rgba(255,255,255,.05); --nm-in-lo:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --plum-hi:#e0709f; --plum:#b04577; --plum-lo:#7a2450;
  --nm-hi:rgba(255,255,255,.045); --nm-lo:rgba(0,0,0,.55); --nm-in-hi:rgba(255,255,255,.05); --nm-in-lo:rgba(0,0,0,.6);
}
.score-card{
  display:flex; flex-wrap:wrap; align-items:center; gap:22px 34px; margin:0 0 18px; padding:22px clamp(16px,3vw,30px);
  background:var(--ground); border-radius:26px;
  box-shadow:10px 10px 24px var(--nm-lo), -10px -10px 24px var(--nm-hi);
  animation:lc-in .4s cubic-bezier(.22,.9,.35,1) both;
}
.score-empty{color:var(--muted); font-size:.9rem}
.ring{position:relative; width:172px; height:172px; flex:0 0 auto}
.ring-disc{
  position:absolute; inset:0; border-radius:50%; background:var(--ground);
  box-shadow:7px 7px 16px var(--nm-lo), -7px -7px 16px var(--nm-hi);
}
.ring svg{position:absolute; inset:14px; width:calc(100% - 28px); height:calc(100% - 28px); overflow:visible}
.ring-track{fill:none; stroke:var(--surface-3); stroke-width:11; opacity:.9}
.ring-arc{fill:none; stroke-width:11; stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1);
  filter:drop-shadow(0 0 5px color-mix(in srgb, var(--plum) 55%, transparent))}
.ring-center{
  position:absolute; inset:34px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--ground); box-shadow:inset 5px 5px 11px var(--nm-in-lo), inset -5px -5px 11px var(--nm-in-hi);
}
.ring-num{font-size:2.5rem; font-weight:800; line-height:1; color:var(--plum); letter-spacing:-.02em}
.ring-max{font-size:.7rem; color:var(--muted); margin-top:3px; font-weight:500}
.score-body{flex:1 1 280px; min-width:0}
.score-title{font-size:1rem; color:var(--muted); font-weight:600; letter-spacing:.01em}
.score-grade{font-size:1.55rem; font-weight:800; color:var(--plum); margin:2px 0 2px}
.score-delta{font-size:.8rem; font-weight:700; margin-inline-start:6px; padding:1px 8px; border-radius:20px;
  box-shadow:inset 2px 2px 5px var(--nm-in-lo), inset -2px -2px 5px var(--nm-in-hi)}
.score-delta.up{color:var(--ok)} .score-delta.down{color:var(--hi)}
.score-sub{margin:0 0 12px; color:var(--muted); font-size:.8rem}
.dom-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:9px 22px}
.dom{display:grid; grid-template-columns:minmax(0,1fr) 84px 26px; align-items:center; gap:8px; font-size:.78rem}
.dom-n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink)}
.dom-bar{height:9px; border-radius:9px; background:var(--ground); overflow:hidden;
  box-shadow:inset 2px 2px 4px var(--nm-in-lo), inset -2px -2px 4px var(--nm-in-hi)}
.dom-bar i{display:block; height:100%; border-radius:9px; background:linear-gradient(90deg,var(--plum-hi),var(--plum-lo))}
.dom-v{font-weight:700; color:var(--plum); text-align:end}
.score-how{margin-top:12px; font-size:.78rem; color:var(--muted)}
.score-how summary{cursor:pointer; color:var(--plum); font-weight:600}
.score-how p{margin:8px 0 0; line-height:1.75; max-width:70ch}
html[data-shell="tauri"] .score-card{background:color-mix(in srgb, var(--ground) 55%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px)}
@media (max-width:640px){ .ring{width:150px; height:150px; margin-inline:auto} .ring-center{inset:30px} .ring-num{font-size:2.15rem} }
@media (prefers-reduced-motion:reduce){ .ring-arc{transition:none} }

/* =====================================================================
   OCEAN BREEZE palette (user-supplied): #0B3D91 primary · #3BA7F2 secondary · #7FE7D6 tertiary · #E8F6FF background
   Neumorphic surfaces + colour on the important parts. Semantic colours (--hi red, --lo blue) are unchanged.
   Loaded after app.css (build.py appends it), so it overrides the earlier teal theme.
   ===================================================================== */
:root{
  --p1:#0B3D91; --p2:#3BA7F2; --p3-soft:#7FE7D6; --p3:#1fb59f;
  --ground:#E8F6FF; --surface:#f3fbff; --surface-2:#dcefFB; --surface-3:#cbe4f6;
  --ink:#0a2350; --muted:#5a7396; --line:rgba(11,61,145,.08);
  --accent:#0B3D91; --accent-2:#2a86d4; --on-accent:#ffffff; --ok:#12a58c;
  --band:rgba(59,167,242,.13);
  --nm-hi:rgba(255,255,255,.95); --nm-lo:rgba(70,125,190,.30); --nm-in-hi:rgba(255,255,255,.9); --nm-in-lo:rgba(70,125,190,.32);
  --shadow:6px 6px 14px rgba(70,125,190,.20), -6px -6px 14px rgba(255,255,255,.95);
  --shadow-sm:3px 3px 8px rgba(70,125,190,.18), -3px -3px 8px rgba(255,255,255,.95);
  --shadow-lg:10px 10px 28px rgba(70,125,190,.28), -8px -8px 22px rgba(255,255,255,.95);
  --edge:inset 0 1px 0 rgba(255,255,255,.7); --head-sh:0 8px 22px rgba(70,125,190,.16);
  --plum:var(--p1); --plum-hi:var(--p2); --plum-lo:var(--p1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0b1a36; --surface:#10254a; --surface-2:#153060; --surface-3:#1c3d78;
  --ink:#e6f3ff; --muted:#8fb0d6; --line:rgba(127,231,214,.08);
  --accent:#3BA7F2; --accent-2:#7FE7D6; --on-accent:#06224d; --ok:#7FE7D6; --p3:#7FE7D6;
  --band:rgba(59,167,242,.16);
  --nm-hi:rgba(120,190,255,.07); --nm-lo:rgba(0,6,20,.6); --nm-in-hi:rgba(120,190,255,.07); --nm-in-lo:rgba(0,6,20,.65);
  --shadow:6px 6px 14px rgba(0,6,20,.55), -5px -5px 12px rgba(120,190,255,.06);
  --shadow-sm:3px 3px 8px rgba(0,6,20,.5), -2px -2px 6px rgba(120,190,255,.05);
  --shadow-lg:12px 12px 30px rgba(0,6,20,.65), -6px -6px 18px rgba(120,190,255,.06);
  --edge:inset 0 1px 0 rgba(120,190,255,.08); --head-sh:0 8px 24px rgba(0,6,20,.5);
}}
:root[data-theme="dark"]{
  --ground:#0b1a36; --surface:#10254a; --surface-2:#153060; --surface-3:#1c3d78;
  --ink:#e6f3ff; --muted:#8fb0d6; --line:rgba(127,231,214,.08);
  --accent:#3BA7F2; --accent-2:#7FE7D6; --on-accent:#06224d; --ok:#7FE7D6; --p3:#7FE7D6;
  --band:rgba(59,167,242,.16);
  --nm-hi:rgba(120,190,255,.07); --nm-lo:rgba(0,6,20,.6); --nm-in-hi:rgba(120,190,255,.07); --nm-in-lo:rgba(0,6,20,.65);
  --shadow:6px 6px 14px rgba(0,6,20,.55), -5px -5px 12px rgba(120,190,255,.06);
  --shadow-sm:3px 3px 8px rgba(0,6,20,.5), -2px -2px 6px rgba(120,190,255,.05);
  --shadow-lg:12px 12px 30px rgba(0,6,20,.65), -6px -6px 18px rgba(120,190,255,.06);
  --edge:inset 0 1px 0 rgba(120,190,255,.08); --head-sh:0 8px 24px rgba(0,6,20,.5);
}

/* --- coloured header, tabs, primary buttons --- */
.head{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%)}
.top{background:transparent}
.brand h1,.ppick{color:var(--accent)}
.tab[aria-selected="true"]{color:var(--accent); border-bottom:3px solid transparent; border-image:linear-gradient(90deg,var(--p1),var(--p2),var(--p3-soft)) 1}
.btn.primary{background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; box-shadow:0 4px 14px rgba(11,61,145,.32)}
:root[data-theme="dark"] .btn.primary{color:#06224d; background:linear-gradient(135deg,var(--p2),var(--p3-soft))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#06224d; background:linear-gradient(135deg,var(--p2),var(--p3-soft))}}
.iconbtn{color:var(--accent)}
.chip b{color:var(--accent)}

/* --- important cards get a colour rail --- */
.nextcard,.fucard,#sum-backup{border-inline-start:4px solid var(--p2) !important}
.fucard.fu-urgent{border-inline-start-color:var(--hi) !important}
.nextcard b,.fh{color:var(--accent)}
.panel-sect{--pc:var(--p1)}
.panel-sect:nth-child(4n+2){--pc:var(--p2)}
.panel-sect:nth-child(4n+3){--pc:var(--p3)}
.panel-sect:nth-child(4n+4){--pc:#6b8fd1}
.panel-sect > .sect-bar{border-inline-start:5px solid var(--pc); border-radius:0}
.panel-sect > .sect-bar .chev{color:var(--pc)}
.panel-sect .wnum{box-shadow:var(--shadow), var(--edge), inset 0 3px 0 var(--pc) !important}
.wnum .kv:not(.hi):not(.lo){color:var(--accent)}
.attn-chip{border-inline-start:4px solid var(--p2) !important}
.attn-chip.hi{border-inline-start-color:var(--hi) !important}
.attn-chip.lo{border-inline-start-color:var(--lo) !important}
.report{border-inline-start:4px solid var(--p2) !important}
.med{border-inline-start:4px solid var(--p3) !important}
.form{border-top:3px solid transparent; border-image:linear-gradient(90deg,var(--p1),var(--p2),var(--p3-soft)) 1}
.card h3,.report h3{color:var(--accent)}

/* --- health status card (Ocean Breeze, gamified, minimal) --- */
.score-card{display:block; padding:22px clamp(16px,3vw,30px); border-radius:28px; background:var(--ground);
  box-shadow:10px 10px 26px var(--nm-lo), -10px -10px 24px var(--nm-hi); position:relative; overflow:hidden}
.score-card::before{content:""; position:absolute; inset-inline-start:0; inset-block:0; width:5px;
  background:linear-gradient(180deg,var(--p3-soft),var(--p2),var(--p1))}
.hs-main{display:flex; flex-wrap:wrap; align-items:center; gap:20px 34px}
.ring-num{color:var(--accent); font-weight:800}
.ring-arc{filter:drop-shadow(0 0 6px rgba(59,167,242,.5))}
.ring-track{stroke:var(--surface-3)}
.score-title{font-size:.95rem; color:var(--muted); font-weight:600}
.score-grade{display:flex; align-items:baseline; gap:10px; margin:2px 0 8px; flex-wrap:wrap}
.lvl{font-size:1.5rem; font-weight:800; color:var(--accent)}
.lvl b{font-size:1.9rem}
.lvl-of{font-size:.85rem; color:var(--muted); font-weight:600}
.lvl-name{font-size:.86rem; font-weight:700; padding:3px 14px; border-radius:20px; color:var(--accent);
  background:linear-gradient(135deg,rgba(127,231,214,.55),rgba(59,167,242,.35));
  box-shadow:inset 2px 2px 5px var(--nm-in-lo), inset -2px -2px 5px var(--nm-in-hi)}
.xp{height:12px; border-radius:12px; background:var(--ground); overflow:hidden; max-width:420px;
  box-shadow:inset 3px 3px 6px var(--nm-in-lo), inset -3px -3px 6px var(--nm-in-hi)}
.xp i{display:block; height:100%; border-radius:12px; background:linear-gradient(90deg,var(--p3-soft),var(--p2),var(--p1)); transition:width .9s cubic-bezier(.22,.9,.3,1)}
.score-sub{margin:8px 0 12px; color:var(--muted); font-size:.8rem}
.hs-metrics{display:flex; flex-wrap:wrap; gap:10px}
.hsm{display:flex; flex-direction:column; gap:1px; padding:8px 14px; border-radius:16px; background:var(--ground); min-width:118px;
  box-shadow:4px 4px 10px var(--nm-lo), -4px -4px 10px var(--nm-hi)}
.hsm em{font-style:normal; font-size:.68rem; color:var(--muted); letter-spacing:.02em}
.hsm b{font-size:.92rem; color:var(--accent)}
.hsm.tr-improving b{color:var(--ok)} .hsm.tr-worsening b{color:var(--hi)}
.hsm.al-on b{color:var(--hi)} .hsm.al-off b{color:var(--ok)}
.medals{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:14px; margin-top:22px}
.medal{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px 10px; border-radius:18px; text-align:center;
  background:var(--ground); color:var(--muted); box-shadow:inset 3px 3px 7px var(--nm-in-lo), inset -3px -3px 7px var(--nm-in-hi); transition:transform .15s}
.medal-ic{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--ground); opacity:.75;
  box-shadow:3px 3px 7px var(--nm-lo), -3px -3px 7px var(--nm-hi)}
.medal-ic svg{width:21px; height:21px}
.medal-n{font-size:.72rem; font-weight:600; line-height:1.3}
.medal-p{width:70%; height:5px; border-radius:5px; background:var(--surface-3); overflow:hidden}
.medal-p i{display:block; height:100%; background:linear-gradient(90deg,var(--p2),var(--p3-soft)); border-radius:5px}
.medal.on{color:var(--accent); background:linear-gradient(160deg,var(--ground),rgba(127,231,214,.22)); box-shadow:5px 5px 12px var(--nm-lo), -5px -5px 12px var(--nm-hi); animation:lc-in .4s both}
.medal.on .medal-ic{opacity:1; color:#fff; background:linear-gradient(135deg,var(--p1),var(--p2)); box-shadow:0 4px 12px rgba(11,61,145,.35)}
.medal.on:hover{transform:translateY(-2px)}
.quests{margin-top:20px}
.quests h4{margin:0 0 8px; font-size:.8rem; color:var(--muted); font-weight:700; letter-spacing:.03em}
.quest{display:flex; align-items:center; gap:12px; width:100%; text-align:start; margin-bottom:8px; padding:10px 14px; border:none; cursor:pointer;
  border-radius:16px; background:var(--ground); color:var(--ink); font:inherit; font-size:.82rem;
  box-shadow:4px 4px 10px var(--nm-lo), -4px -4px 10px var(--nm-hi)}
.quest:hover{box-shadow:6px 6px 14px var(--nm-lo), -6px -6px 14px var(--nm-hi)}
.q-dot{flex:0 0 auto; width:14px; height:14px; border-radius:50%; background:var(--ground); box-shadow:inset 2px 2px 4px var(--nm-in-lo), inset -2px -2px 4px var(--nm-in-hi); position:relative}
.q-dot::after{content:""; position:absolute; inset:4px; border-radius:50%; background:linear-gradient(135deg,var(--p2),var(--p3-soft))}
.score-how{margin-top:16px}
.score-how summary{color:var(--accent-2)}
.dom-bar i{background:linear-gradient(90deg,var(--p3-soft),var(--p2),var(--p1))}
.dom-v{color:var(--accent)}
@media (max-width:640px){ .medals{grid-template-columns:repeat(2,1fr)} .hsm{flex:1 1 40%} }
html[data-shell="tauri"] .score-card{background:color-mix(in srgb, var(--ground) 60%, transparent)}
</style>

      <p class="hint" data-fa="عکس برگهٔ آزمایش یا فایل PDF را بدهید؛ برنامه مقادیر را می‌خواند و بر اساس تاریخ به جدول و نمودار اضافه می‌کند. سند نگه داشته نمی‌شود."
         data-en="Give a photo of the report or a PDF; the app reads the values and adds them to the table and charts by date. The document is not kept."></p>
      <div class="row">
        <button class="btn primary" id="cap-photo" data-fa="عکس بگیر" data-en="Take photo"></button>
        <button class="btn" id="cap-file" data-fa="انتخاب از گالری یا فایل PDF" data-en="Pick from gallery or PDF"></button>
        <input id="cap-in" type="file" accept="image/*" capture="environment" hidden>
        <input id="cap-in2" type="file" accept="image/*,application/pdf" multiple hidden>
      </div>
      <p class="hint" id="cap-status" hidden></p>
      <p class="hint" id="cap-nokey" hidden
         data-fa="کلید Gemini تنظیم نشده. پایین‌تر کلید را وارد کنید، یا از افزودن دستی استفاده کنید."
         data-en="No Gemini key set. Add a key below, or use manual entry."></p>
      <button class="btn sm" id="cap-undo" hidden
         data-fa="بازگرداندن آخرین مقادیرِ افزوده‌شده با عکس"
         data-en="Undo last photo-added values"></button>
    </div>

    <div class="form" id="sect-custom" data-sect-fa="آزمایش سفارشی (تعریف آزمایش جدید)" data-sect-en="Custom test (define a new analyte)">
      <h3 class="fh" data-fa="آزمایش سفارشی" data-en="Custom test"></h3>
      <p class="hint" data-fa="آزمایشی که در فهرست نیست را تعریف کنید؛ مثل بقیه در جدول، نمودار و امتیاز (اگر بازه دارد) می‌آید." data-en="Define an analyte that is not in the list; it then appears in the table and charts like any other."></p>
      <div class="row">
        <div class="field" style="flex:2 1 180px"><label data-fa="نام (فارسی)" data-en="Name (Persian)">‏</label><input id="ct-fa"></div>
        <div class="field" style="flex:2 1 180px"><label data-fa="نام (انگلیسی)" data-en="Name (English)">‏</label><input id="ct-en" dir="ltr"></div>
        <div class="field"><label data-fa="واحد" data-en="Unit">‏</label><input id="ct-unit" dir="ltr"></div>
      </div>
      <div class="row">
        <div class="field"><label data-fa="حد پایین" data-en="Low">‏</label><input id="ct-low" type="number" step="any"></div>
        <div class="field"><label data-fa="حد بالا" data-en="High">‏</label><input id="ct-high" type="number" step="any"></div>
        <button class="btn primary" id="ct-add" data-fa="تعریف آزمایش" data-en="Define test" style="align-self:flex-end"></button>
      </div>
      <ul class="mine" id="ct-list"></ul>
    </div>

    <div class="form">
      <h3 class="fh" data-fa="افزودن دستی" data-en="Add manually"></h3>
      <div class="row">
        <div class="field"><label data-fa="تاریخ شمسی" data-en="Jalali date">‏</label>
          <input id="f-j" placeholder="1405/06/01" inputmode="numeric"></div>
        <div class="field"><label data-fa="تاریخ میلادی" data-en="Gregorian date">‏</label>
          <input id="f-g" type="date"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:2 1 220px"><label data-fa="آزمایش" data-en="Test">‏</label>
          <select id="f-test"></select></div>
        <div class="field"><label data-fa="مقدار" data-en="Value">‏</label>
          <div style="display:flex;gap:6px"><input id="f-val" type="number" step="any" inputmode="decimal" style="flex:1 1 90px;min-width:0">
          <select id="f-unit" hidden style="flex:0 0 auto"></select></div></div>
      </div>
      <button class="btn primary" id="f-add" data-fa="افزودن نتیجه" data-en="Add result"></button>
      <ul class="mine" id="mine"></ul>
    </div>

    <div class="form" id="sect-nt" data-sect-fa="یادآور آزمایش بعدی" data-sect-en="Next test reminder">
      <h3 class="fh" data-fa="یادآور آزمایش بعدی" data-en="Next test reminder"></h3>
      <div class="row">
        <div class="field"><label data-fa="تاریخ شمسی" data-en="Jalali date">‏</label>
          <input id="nt-j" inputmode="numeric" placeholder="1405/09/01"></div>
        <div class="field" style="flex:2 1 200px"><label data-fa="یادداشت (اختیاری)" data-en="Label (optional)">‏</label>
          <input id="nt-label" placeholder=""></div>
      </div>
      <div class="row">
        <button class="btn sm" id="nt-save" data-fa="ذخیره" data-en="Save"></button>
        <button class="btn sm" id="nt-clear" data-fa="حذف یادآور" data-en="Clear reminder"></button>
      </div>
    </div>

    <div class="form" id="sect-backup" data-sect-fa="پشتیبان‌گیری و بازیابی" data-sect-en="Backup & restore">
      <h3 class="fh" data-fa="پشتیبان‌گیری و بازیابی" data-en="Backup & restore"></h3>
      <p class="hint" id="bk-local"></p>
      <div class="row">
        <button class="btn sm" id="bk-export" data-fa="ساخت فایل پشتیبان (این بیمار)" data-en="Create backup file (this patient)"></button>
        <button class="btn sm" id="bk-exportall" data-fa="ساخت فایل پشتیبان (همهٔ بیماران)" data-en="Create backup file (all patients)"></button>
        <button class="btn sm" id="bk-import" data-fa="بازیابی از فایل" data-en="Restore from file"></button>
        <input id="bk-import-in" type="file" accept="application/json,.json" hidden>
        <button class="btn sm" id="bk-mf" data-fa="وارد کردن از MedicalFile" data-en="Import from MedicalFile"></button>
        <input id="bk-mf-in" type="file" accept="application/json,.json" hidden>
      </div>
      <textarea class="io" id="io"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="io-copy" data-fa="کپی کل متن" data-en="Copy all"></button>
        <button class="btn sm" id="io-load" data-fa="بارگذاری از متن بالا" data-en="Load from text above"></button>
        <button class="btn sm" id="io-clear" data-fa="پاک کردن افزوده‌های من" data-en="Clear my additions"></button>
      </div>
    </div>

    <div class="form" id="sect-gk" data-sect-fa="کلید Gemini" data-sect-en="Gemini key">
      <h3 class="fh" data-fa="کلید Gemini" data-en="Gemini key"></h3>
      <p class="hint" data-fa="کلید رایگان از Google AI Studio. فقط روی همین دستگاه ذخیره می‌شود و جای دیگری فرستاده نمی‌شود."
         data-en="Free key from Google AI Studio. Stored only on this device; sent nowhere else."></p>
      <div class="row">
        <div class="field" style="flex:2 1 240px"><label data-fa="کلید" data-en="Key">‏</label>
          <input id="gk" type="password" autocomplete="off" placeholder="AIza…"></div>
        <div class="field"><label data-fa="مدل" data-en="Model">‏</label>
          <select id="gm">
            <option value="gemini-flash-latest">gemini-flash-latest</option>
            <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            <option value="gemini-3.8-flash">gemini-3.8-flash</option>
            <option value="gemini-flash-lite-latest">gemini-flash-lite-latest</option>
          </select></div>
      </div>
      <div class="row">
        <button class="btn sm" id="gk-save" data-fa="ذخیره" data-en="Save"></button>
        <button class="btn sm" id="gk-test" data-fa="تست کلید" data-en="Test key"></button>
        <button class="btn sm" id="gk-clear" data-fa="پاک کردن کلید" data-en="Clear key"></button>
        <span class="hint" id="gk-msg" style="margin:0"></span>
      </div>
    </div>

    <div class="form" id="sect-src" data-sect-fa="منبع دادهٔ پایه و هشدارها" data-sect-en="Baseline data source & notes">

      <div class="src" id="src"></div>
    </div>
  </section>

  <dialog id="rev">
    <div class="revbox">
      <h3 class="fh" data-fa="بررسی مقادیر استخراج‌شده" data-en="Review extracted values"></h3>

      </div>

      </div>
    </div>

/* per-patient user data. k = in-memory name / backup key, ls = localStorage suffix, def = default */
var USER_SLICES = [
  {k:"additions", ls:"additions.v1", def:[]}, {k:"notes", ls:"notes", def:{}}, {k:"nextTest", ls:"nextTest", def:null},
  {k:"radiology", ls:"radiology", def:[]},   {k:"meds", ls:"meds", def:[]},

/* dynamic tests: user-defined analytes merged into the catalog for the ACTIVE patient */
function applyCustomTests(){

    keys.push(c.key);

function saveSlice(name){

        : name==="pathology" ? pathAdds : name==="notes" ? notes : name==="nextTest" ? nextTest

function radAll(){

/* A patient added in the app whose national ID now belongs to a built-in patient is folded into that patient. */
function absorbDuplicateCustoms(){
  var moved=false;
  custom=custom.filter(function(c){
    var nid=PLF.nid.norm(c.nationalId); if(!nid) return true;
    var target=PATIENTS.filter(function(p){ return !p.custom && PLF.nid.norm(p.nationalId)===nid; })[0];
    if(!target) return true;
    USER_SLICES.forEach(function(x){
      var cv=jget("lab."+c.id+"."+x.ls, null); if(cv==null) return;
      var tv=jget("lab."+target.id+"."+x.ls, JSON.parse(JSON.stringify(x.def))), out;
      if(Array.isArray(cv)){ out=Array.isArray(tv)?tv.slice():[]; var seen=out.map(function(o){ return JSON.stringify(o); });
        cv.forEach(function(o){ if(seen.indexOf(JSON.stringify(o))<0) out.push(o); }); }
      else if(typeof cv==="string"){ out = tv && tv!==cv ? tv+"\n\n"+cv : cv; }
      else if(cv && typeof cv==="object"){ out=Object.assign({}, cv, tv||{}); }
      else out = tv==null ? cv : tv;
      LS.set("lab."+target.id+"."+x.ls, JSON.stringify(out));
    });
    PSUFFIX.forEach(function(s){ try{ localStorage.removeItem("lab."+c.id+"."+s); }catch(e){} });
    if(PID===c.id){ PID=target.id; LS.set("lab.pid", PID); }
    moved=true; return false;
  });
  if(moved) saveRoster();
}

/* ---------- helpers ---------- */
function t(fa,en){ return lang==="fa"?fa:en; }
function tn(v){ return (v==null||v==="")?"":String(v); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function panelOn(name){
  var p=document.getElementById("p-"+name); return !!p && p.classList.contains("on");
}
/* make a non-button element operable by mouse AND keyboard */
function activate(el, fn){
  if(!el) return;
  el.setAttribute("tabindex","0");
  if(!el.getAttribute("role")) el.setAttribute("role","button");
  el.onclick = fn;
  el.onkeydown = function(e){
    if(e.key==="Enter" || e.key===" " || e.key==="Spacebar"){ e.preventDefault(); fn.call(el, e); }
  };
}

/* ---- dates (pure code lives in src/lib/dates.js) ---- */
var faDigits=DT.faDigits, jStrToG=DT.jStrToG, gStrToJ=DT.gStrToJ, p2=DT.p2,
    toGregorian=DT.toGregorian, toJalali=DT.toJalali, ageBetween=DT.ageBetween;
function birthG(){ return jStrToG((D.patient&&D.patient.birth)||"")||null; }   // per active patient
function ageAt(gDate){ return ageBetween(birthG(), gDate); }
function ageNow(){ return ageBetween(birthG(), new Date().toISOString().slice(0,10)); }
(function convCheck(){
  var a=toGregorian(1403,1,1), b=toJalali(2024,3,20);
  if(!(a[0]===2024&&a[1]===3&&a[2]===20&&b[0]===1403&&b[1]===1&&b[2]===1))
    console.warn("date conversion self-check failed", a, b);
})();

/* ---- reference range (std unit) for the ACTIVE patient: sex/age aware ---- */
function rng(key){ return PLF.range.resolve(D.tests[key], {sex:D.patient.sex, age:ageNow()}); }
function flagOf(key,v){ return D.tests[key] ? PLF.range.flag(rng(key), v) : ""; }
function severityOf(key,v){ return D.tests[key] ? PLF.range.severity(rng(key), v) : 0; }

/* ---- display units. Data is stored in the standard unit; the user may view
   any listed alternative (per test, remembered in lab.unit.<key>). ---- */
function hasAlts(key){ var m=D.tests[key]; return !!(m && m.alts && m.alts.length); }
function dUnit(key){
  var m=D.tests[key]; if(!m) return "";
  var u=LS.get("lab.unit."+key);
  return (u && PLF.units.list(m).indexOf(u)>=0) ? u : (m.unit||"");
}
function dv(key,v){                              // std value -> number in display unit
  var m=D.tests[key], u=dUnit(key);
  if(!m || PLF.units.isStd(m,u)) return v;
  var r=PLF.units.fromStd(m,u,v); return r==null?v:r;
}
function dvs(key,v){                             // formatted string in display unit
  var m=D.tests[key];
  if(!m || PLF.units.isStd(m,dUnit(key))) return tn(v);
  return PLF.units.fmt(dv(key,v));
}
function rangeText(key){
  var m=D.tests[key]; if(!m) return "";
  var r=rng(key), lo=r.low==null?null:dvs(key,r.low), hi=r.high==null?null:dvs(key,r.high);
  if(lo!=null && hi!=null) return lo+"–"+hi;
  if(hi!=null) return "< "+hi;
  if(lo!=null) return "> "+lo;
  return "";
}

function cycleUnit(key){

/* merged reports: base + user additions grouped by gregorian date */
function buildReports(){
  var map={}, list=D.reports.map(function(r){
    var c={id:r.id,j:r.j,g:r.g,age:r.age,dr:r.dr,note:r.note,v:{}};
    for(var k in r.v) c.v[k]=r.v[k];
    map[r.g]=c; return c;
  });
  additions.forEach(function(a){
    if(!a||!a.key||a.val==null||isNaN(+a.val)) return;
    var r=map[a.g];
    if(!r){ r={id:"ADD "+(a.j||a.g),j:a.j||a.g,g:a.g,age:null,dr:null,mine:true,v:{}}; map[a.g]=r; list.push(r); }
    if(!r.mine && r.v[a.key]!=null && r.v[a.key]!==+a.val){   // user value overwrites a baseline value
      (r.ovr=r.ovr||{})[a.key]=true;
    }
    r.v[a.key]=+a.val; r.hasMine=true;
  });
  list.sort(function(x,y){ return x.g<y.g?-1:x.g>y.g?1:0; });
  return list;
}
function activeTestKeys(){                       // keys that appear in >=1 report, in catalog order
  var seen={}; S.forEach(function(r){ for(var k in r.v) seen[k]=1; });
  return Object.keys(D.tests).filter(function(k){ return seen[k]; });
}

/* ---------- analytics ---------- */
function jYear(r){ var y=faDigits(r.j).slice(0,4); return /^\d{4}$/.test(y)?y:""; }
function years(){
  var ys={}; S.forEach(function(r){ var y=jYear(r); if(y) ys[y]=1; });
  return Object.keys(ys).sort();
}
function computeVis(){
  VIS = yearFrom ? S.filter(function(r){ return jYear(r) >= yearFrom; }) : S.slice();
  if(!VIS.length) VIS = S.slice();
}
function pointsOf(key,list){
  var pts=[];
  (list||VIS).forEach(function(r){
    var v=r.v[key], tm=Date.parse(r.g);
    if(typeof v==="number" && !isNaN(tm)) pts.push({g:r.g, j:r.j, v:v, t:tm});
  });
  return pts;
}
function severity(key,v){ return severityOf(key,v); }   // 0 in range, else normalised distance outside
function trendInfo(key,list){                    // last value vs the one before
  var p=pointsOf(key,list); if(p.length<2) return null;
  var a=p[p.length-2].v, b=p[p.length-1].v, d=b-a;
  return {
    dir: Math.abs(d)<1e-9 ? "flat" : (d>0?"up":"down"),
    delta: d,
    worse:  severity(key,b) > severity(key,a)+1e-9,
    better: severity(key,b) < severity(key,a)-1e-9
  };
}
function worseningStreak(key,list,n){            // severity strictly rising over last n and still out of range
  n=n||3; var p=pointsOf(key,list); if(p.length<n) return false;
  var w=p.slice(p.length-n).map(function(x){ return severity(key,x.v); });
  for(var i=1;i<w.length;i++){ if(w[i] <= w[i-1]) return false; }
  return w[w.length-1] > 0;
}
function trendGlyph(ti){
  if(!ti) return "";
  var g = ti.dir==="up" ? "▲" : ti.dir==="down" ? "▼" : "▬";
  var cls = ti.worse ? "up" : ti.better ? "good" : "flat";
  var lbl = ti.worse ? t("بدتر شده","worse") : ti.better ? t("بهتر شده","better") : t("تغییر مهمی نکرده","little change");
  return ' <span class="trend '+cls+'" title="'+esc(lbl)+'">'+g+'</span>';
}

/* ---------- charts ---------- */
function series(key){ return pointsOf(key, VIS); }
function spark(key,compact){
  var m=D.tests[key], pts=series(key);
  if(pts.length<1) return "";
  var W=290,H=132, pad={t:10,r:12,b:20,l:34};
  var xs=pts.map(function(p){return p.t}), ys=pts.map(function(p){return dv(key,p.v)});
  var tmin=Math.min.apply(0,xs), tmax=Math.max.apply(0,xs); if(tmin===tmax){tmin-=1;tmax+=1;}
  var R=rng(key), lo=R.low==null?null:dv(key,R.low), hi=R.high==null?null:dv(key,R.high);
  var dmin=Math.min.apply(0,ys), dmax=Math.max.apply(0,ys);
  if(lo!=null) dmin=Math.min(dmin,lo);
  if(hi!=null) dmax=Math.max(dmax,hi);
  var span=(dmax-dmin)||1; dmin-=span*0.12; dmax+=span*0.12;
  function X(t){ return pad.l + (t-tmin)/(tmax-tmin) * (W-pad.l-pad.r); }
  function Y(v){ return pad.t + (1-(v-dmin)/(dmax-dmin)) * (H-pad.t-pad.b); }
  var g="";
  // reference band
  var bTop = hi!=null ? Y(hi) : pad.t;
  var bBot = lo!=null ? Y(lo) : (H-pad.b);
  if(hi!=null || lo!=null)
    g+='<rect x="'+pad.l+'" y="'+bTop.toFixed(1)+'" width="'+(W-pad.l-pad.r)+'" height="'+
       Math.max(0,(bBot-bTop)).toFixed(1)+'" fill="var(--band)"/>';
  if(hi!=null) g+=dashLine(pad.l,W-pad.r,Y(hi),"var(--hi)");
  if(lo!=null) g+=dashLine(pad.l,W-pad.r,Y(lo),"var(--lo)");
  // axis labels
  if(!compact){       // axis text is skipped in the wide overview strips: preserveAspectRatio="none" would distort it
    g+=axText(pad.l-6,Y(dmax)+4,fmt(dmax),"end");
    g+=axText(pad.l-6,Y(dmin)+4,fmt(dmin),"end");
    g+=axText(pad.l,H-6,pts[0].j,"start");
    if(pts.length>1) g+=axText(W-pad.r,H-6,pts[pts.length-1].j,"end");
  }
  // line
  if(pts.length>1){
    var d=pts.map(function(p,i){ return (i?"L":"M")+X(p.t).toFixed(1)+" "+Y(dv(key,p.v)).toFixed(1); }).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>';
  }
  // points
  pts.forEach(function(p,i){
    var f=flagOf(key,p.v), col=f==="hi"?"var(--hi)":f==="lo"?"var(--lo)":"var(--ok)";
    var last=i===pts.length-1;
    g+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(dv(key,p.v)).toFixed(1)+'" r="'+(last?3.6:2.4)+
       '" fill="'+col+'" stroke="var(--surface)" stroke-width="'+(last?1.5:1)+'"><title>'+
       esc(p.j+"  ·  "+dvs(key,p.v)+(dUnit(key)?" "+dUnit(key):""))+'</title></circle>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" style="direction:ltr" aria-label="'+esc(t(m.fa,m.en))+'">'+g+'</svg>';
}
function dashLine(x1,x2,y,c){ return '<line x1="'+x1+'" x2="'+x2+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+
  '" stroke="'+c+'" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>'; }
function axText(x,y,s,anchor){ return '<text x="'+x+'" y="'+y+'" font-size="8.5" fill="var(--muted)" '+
  'text-anchor="'+anchor+'" style="font-family:ui-monospace,Consolas,monospace">'+esc(s)+'</text>'; }
function fmt(n){ return Math.abs(n)>=100?Math.round(n):Math.round(n*10)/10; }

function chartKeys(){
  var base=activeTestKeys().filter(function(k){ return D.tests[k].chart && series(k).length>=2; });
  extraCharts.forEach(function(k){ if(base.indexOf(k)<0 && series(k).length>=1) base.push(k); });
  return base;
}
function renderCharts(){
  var wrap=document.getElementById("charts"), keys=chartKeys();
  wrap.innerHTML = keys.map(function(k){
    var m=D.tests[k], pts=series(k), lastP=pts[pts.length-1], prev=pts[pts.length-2];
    var delta = (lastP&&prev)? (dv(k,lastP.v)-dv(k,prev.v)) : null;
    var dtxt = delta==null ? "" :
      (delta>0?"▲ +":delta<0?"▼ −":"± ")+ PLF.units.fmt(Math.abs(delta))+
      "  "+t("از قبل","vs prev");
    var f = lastP? flagOf(k,lastP.v):"";
    return '<div class="card"><h3><span>'+esc(t(m.fa,m.en))+'</span><span class="u num">'+esc(dUnit(k)||"")+unitBtn(k)+'</span></h3>'+
      '<div class="last">'+t("آخرین","Latest")+': <bdi class="num"><b>'+(lastP?esc(dvs(k,lastP.v)):"—")+'</b></bdi> '+
      '<bdi class="num" style="color:'+(f==="hi"?"var(--hi)":f==="lo"?"var(--lo)":"var(--muted)")+'">'+esc(dtxt)+'</bdi></div>'+
      spark(k)+'</div>';
  }).join("") || '<p class="hint">'+t("داده کافی برای نمودار نیست.","Not enough data to chart.")+'</p>';
  bindUnitBtns(wrap);
  wrap.querySelectorAll(".card").forEach(function(card){
    var lab=card.querySelector("svg") && card.querySelector("svg").getAttribute("aria-label");
    var k=keys.filter(function(x){ return t(D.tests[x].fa,D.tests[x].en)===lab; })[0];
    if(k){ card.classList.add("tap"); card.style.cursor="pointer";
      activate(card, function(){ openBig(k); }); }
  });

  var pick=document.getElementById("pick");
  var shown=chartKeys(), opts='<option value="">— '+t("انتخاب","choose")+" —</option>";
  activeTestKeys().forEach(function(k){
    if(shown.indexOf(k)>=0) return;
    opts+='<option value="'+k+'">'+esc(t(D.tests[k].fa,D.tests[k].en))+'</option>';
  });
  pick.innerHTML=opts;
}

/* ---------- pathology ----------
   baked records (data/patients/*.json): {j,g,age,dr,file,spec_fa,spec_en,clin_en,dx_fa,dx_en,mic_en}
   user records: {id,j,g,specimen,center,dr,clinical,gross,micro,diagnosis,file,followUp} — editable */
var pathEdit=-1;
var PATH_FIELDS={"path-j":"j","path-specimen":"specimen","path-center":"center","path-dr":"dr","path-clin":"clinical",
  "path-gross":"gross","path-micro":"micro","path-diag":"diagnosis","path-file":"file"};
function pathAll(){
  var baked=(D.pathology||[]).map(function(p,i){ return {j:p.j,g:p.g,age:p.age,dr:p.dr,file:p.file,specimen:t(p.spec_fa,p.spec_en),
    clinical:p.clin_en, micro:p.mic_en, diagnosis:t(p.dx_fa,p.dx_en), _dxText:(p.dx_en||"")+" "+(p.dx_fa||""), _key:"b"+i}; });
  var mine=pathAdds.map(function(r,i){ var o={}; for(var k in r) o[k]=r[k]; o._mine=true; o._idx=i; o._key=r.id||("m"+i); return o; });
  return baked.concat(mine).sort(function(a,b){ return String(b.g||b.j||"").localeCompare(String(a.g||a.j||"")); });
}
function pathFormMode(editing){
  var b=document.getElementById("path-add"), h=document.getElementById("path-formh");
  b.setAttribute("data-fa",editing?"ذخیرهٔ تغییرات":"افزودن"); b.setAttribute("data-en",editing?"Save changes":"Add");

  document.getElementById("path-cancel").hidden=!editing; localizeIn(b.parentNode); localizeIn(h.parentNode);

function renderPath(){
  var w=document.getElementById("pathWrap"); if(!w) return;
  fuOptions("path");
  var list=pathAll();
  if(!list.length){ w.innerHTML='<p class="hint" data-fa="هنوز گزارش پاتولوژی‌ای ثبت نشده." data-en="No pathology reports yet."></p>'; localizeIn(w); return; }
  function row(k,v){ return v?'<p><span class="k">'+esc(k)+': </span>'+esc(v)+'</p>':''; }
  w.innerHTML=list.map(function(p){
    var f=p._mine ? p.followUp : PLF.followup.apply({followUp:{done:!!fuDone["path:"+p._key]}}, p._dxText||p.diagnosis).followUp;
    return '<div class="report" id="rec-path-'+esc(p._key)+'"><div class="meta num">'+esc(faDigits(p.j||""))+(p.g?'  ·  '+esc(p.g):'')+
      (p.age!=null&&p.age!==""?'  ·  '+t("سن","age")+" "+esc(p.age):'')+(p.center?'  ·  '+esc(p.center):'')+(p.dr?'  ·  '+esc(p.dr):'')+'</div>'+

function scoreAt(idx, todayG){
  var latest={}, i, k;
  for(i=0;i<=idx;i++) for(k in S[i].v) if(D.tests[k]) latest[k]={v:S[i].v[k], g:S[i].g};
  var hist=S.slice(0,idx+1), items=[];
  var ref=Date.parse(todayG||S[idx].g);
  Object.keys(latest).forEach(function(key){
    var L=latest[key], ti=trendInfo(key,hist);
    items.push({ key:key, cat:D.tests[key].cat, sev:severityOf(key,L.v),
      stale:(ref-Date.parse(L.g))/86400000>365, worse:!!(ti&&ti.worse) });
  });
  return PLF.score.compute(items);
}
function daysSince(g){ var d=Date.parse(g); return isNaN(d)?null:Math.floor((Date.now()-d)/86400000); }
function gameFacts(){
  var latest={}, i, k;
  for(i=0;i<S.length;i++) for(k in S[i].v) if(D.tests[k]) latest[k]={v:S[i].v[k], g:S[i].g};
  var keys=Object.keys(latest), inR=0, worst=0, fresh=0, improved=0;
  keys.forEach(function(key){
    var L=latest[key], sev=severityOf(key,L.v), d=daysSince(L.g);
    if(sev===0) inR++; if(sev>worst) worst=sev; if(d!=null && d<=365) fresh++;
    var ti=trendInfo(key,S); if(ti && ti.better) improved++;
  });
  var stale=["hba1c","fbs","cr","ldl","tsh","hb","psat","vitd"].filter(function(k){ return latest[k]; })
    .map(function(k){ return {key:k, days:daysSince(latest[k].g)}; }).filter(function(x){ return x.days!=null && x.days>365; })
    .sort(function(a,b){ return b.days-a.days; });
  var p=curPatient(), filled=[p.nationalId, p.sex, p.birth].filter(Boolean).length;
  var missing=[]; if(!p.nationalId) missing.push("nationalId"); if(!p.sex) missing.push("sex"); if(!p.birth) missing.push("birth");
  var fuRecs=0; radAll().forEach(function(r){ if(r.followUp && r.followUp.level!=="none") fuRecs++; });
  pathAll().forEach(function(r){ var f=r._mine?r.followUp:PLF.followup.apply({followUp:{}}, r._dxText||r.diagnosis).followUp; if(f && f.level!=="none") fuRecs++; });

  return { hasData:keys.length>0, allInRange:keys.length>0 && inR===keys.length, inRangeShare:keys.length?inR/keys.length:0,
    improvedCount:improved, lastReportDaysAgo:last?daysSince(last.g):null, profileFilled:filled===3, profileFields:filled, profileMissing:missing,
    openFollowUps:followUpItems().length, followUpRecords:fuRecs, backupDaysAgo:bk?Math.floor((Date.now()-bk)/86400000):null,
    reportsCount:S.length, staleTests:stale, confidence:keys.length?Math.round(fresh/keys.length*100):0, worstSeverity:worst };
}

function followUpItems(){
  var out=[];
  radAll().forEach(function(r){
    var f=r._mine?r.followUp:null;
    if(f && f.level!=="none" && !f.done)
      out.push({kind:"rad", key:radKey(r), rec:r, level:f.level, note:f.note, dueDate:f.dueDate, date:r.j||r.g||"",
        title:(r.modality||"")+(r.region?" — "+r.region:"")});

    var f=p._mine ? p.followUp : PLF.followup.apply({followUp:{done:!!fuDone["path:"+p._key]}}, p._dxText||p.diagnosis).followUp;
    if(f && f.level!=="none" && !f.done)
      out.push({kind:"path", key:p._key, rec:p, level:f.level, note:f.note, dueDate:f.dueDate, date:p.j||p.g||"",
        title:t("پاتولوژی","Pathology")+(p.specimen?" — "+p.specimen:"")});

  var s=String(name||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,18);
  return "c_"+(s||"t")+"_"+Date.now().toString(36).slice(-4);
}
function createCustomTest(o){

    low:(o.low===""||o.low==null||isNaN(+o.low))?null:+o.low, high:(o.high===""||o.high==null||isNaN(+o.high))?null:+o.high});
  saveSlice("customTests"); applyCustomTests(); fillTestSelect();

/* ===== photo / PDF extraction via Gemini ===== */
function downscaleImage(file){                 // shrink big photos before upload (faster + cheaper + avoids limits)
  return new Promise(function(res){
    if(!/^image\//.test(file.type)){ res(file); return; }
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var mx=1600, w=img.naturalWidth, h=img.naturalHeight;
      if(Math.max(w,h)<=mx && file.size<1500000){ URL.revokeObjectURL(url); res(file); return; }
      var s=mx/Math.max(w,h); if(s>1) s=1;
      var cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ res(b||file); }, "image/jpeg", 0.82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function fileToPart(file){
  return downscaleImage(file).then(function(f){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ res({inline_data:{mime_type:(f.type||file.type||"application/octet-stream"),
                                             data:String(r.result).split(",")[1]}}); };
      r.onerror=function(){ rej(new Error(t("خواندن فایل ناموفق","file read failed"))); };
      r.readAsDataURL(f);
    });
  });
}
function catalogForPrompt(){
  return Object.keys(D.tests).map(function(k){
    var m=D.tests[k]; return k+" = "+m.en+" / "+m.fa+(m.unit?" ["+m.unit+"]":"");
  }).join("\n");
}
function gemPrompt(){
  return "You are reading a medical laboratory report (image or PDF), usually mixed Persian/English. "+
    "Extract every numeric test result. Convert Persian/Arabic digits to Western. "+
    "If a Jalali (Shamsi) collection or print date is shown, return it as jalali \"YYYY/MM/DD\". "+
    "Return ONLY minified JSON: {\"jalali\":string|null,\"gregorian\":string|null,"+
    "\"items\":[{\"key\":string,\"label\":string,\"value\":number,\"unit\":string}]}. "+
    "For each result set \"key\" to the matching catalog key below, or \"\" if none matches. "+
    "Skip non-numeric results.\nCATALOG:\n"+catalogForPrompt();
}
/* one Gemini call: prompt + parts -> parsed JSON object (throws readable errors) */
function geminiCall(promptText, parts, attempt){
  if(!gKey()) return Promise.reject(new Error("nokey"));
  attempt = attempt||0;
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, GEMINI_TIMEOUT_MS);
  var body={ contents:[{ parts:[{text:promptText}].concat(parts||[]) }],
             generationConfig:{ temperature:0, responseMimeType:"application/json", maxOutputTokens:4096 } };
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/"+
               encodeURIComponent(gModel())+":generateContent?key="+encodeURIComponent(gKey()),
    { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body),
      signal: ctrl?ctrl.signal:undefined })
  .then(function(r){
    return r.json().then(function(j){
      if(!r.ok){ var er=new Error((j&&j.error&&j.error.message)||("HTTP "+r.status)); er.status=r.status; throw er; }
      return j;
    });
  }).then(function(j){
    var c=j.candidates&&j.candidates[0], fr=c&&c.finishReason;
    if(fr==="SAFETY"||fr==="RECITATION") throw new Error(t("مدل پاسخ نداد (فیلتر محتوا).","Model refused (content filter)."));
    var txt="";
    try{ txt=c.content.parts.map(function(p){return p.text||"";}).join(""); }catch(e){}
    txt=txt.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
    if(!txt) throw new Error(t("پاسخ خالی بود، دوباره تلاش کنید.","Empty response, try again."));
    try{ return JSON.parse(txt); }
    catch(e){
      var m=txt.match(/\{[\s\S]*\}/);            // salvage the first JSON object
      if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
      throw new Error(t("پاسخ نامعتبر بود"+(fr==="MAX_TOKENS"?" (ناقص)":"")+"، دوباره تلاش کنید.",
                        "Invalid response"+(fr==="MAX_TOKENS"?" (truncated)":"")+", try again."));
    }
  }).catch(function(e){
    var timedOut = e && e.name==="AbortError";
    // 429/403 = quota/key issue -> try the other key; 500/503 = model overloaded; timeout = slow/flaky VPN link.
    // All transient -> retry (same or next key), short backoff, before giving up.
    var retryable = timedOut || (e && (e.status===429 || e.status===403 || e.status===400 || e.status===500 || e.status===503));
    // a timeout already burned a full GEMINI_TIMEOUT_MS, so cap those retries low (worst case ~ maxKeys * timeout);
    // fast-failing errors (429/503/...) can afford more attempts.
    var maxAttempts = timedOut ? Math.max(1, EMB_KEYS.length) : Math.max(2, EMB_KEYS.length*2);
    if(retryable && attempt < maxAttempts-1){
      clearTimeout(timer);
      if(timedOut || e.status!==500 && e.status!==503) nextKey();      // rotate key: on timeout, and on quota/auth errors
      else if(attempt%2===1) nextKey();                                // overloaded (503/500): alternate keys every other try
      var delay = Math.min(4000, 500*Math.pow(2,attempt));             // 500,1000,2000,4000,4000...
      return new Promise(function(res){ setTimeout(res, delay); }).then(function(){ return geminiCall(promptText, parts, attempt+1); });
    }
    if(timedOut) throw new Error(t("زمان درخواست تمام شد. اینترنت/VPN را بررسی و دوباره تلاش کنید.",
                                   "Request timed out. Check internet/VPN and retry."));
    if(e && (e.status===500 || e.status===503)) throw new Error(t("سرور گوگل شلوغ است؛ چند دقیقه دیگر دوباره تلاش کنید.","Google's server is overloaded; try again in a few minutes."));
    throw e;
  }).then(function(v){ clearTimeout(timer); return v; },
          function(e){ clearTimeout(timer); throw e; });
}
function checkFiles(files){
  var big=Array.prototype.filter.call(files||[],function(f){ return f.size>18*1024*1024; });
  return big.length ? new Error(t("فایل خیلی بزرگ است (بیش از ۱۸ مگابایت). عکس بگیرید یا PDF را کوچک‌تر کنید.",
                                  "File too large (>18 MB). Use a photo or a smaller PDF.")) : null;
}
function geminiExtract(files){
  var bad=checkFiles(files); if(bad) return Promise.reject(bad);
  return Promise.all(Array.prototype.map.call(files,fileToPart)).then(function(parts){ return geminiCall(gemPrompt(), parts); });
}
var normU=PLF.units.norm;
function round2(n){ return Math.round(n*100)/100; }
/* extracted unit -> catalog standard unit (lib/units.js); null when already standard or unknown */
function convertExtracted(unit,key,v){
  var m=D.tests[key]; if(!m||!unit||PLF.units.isStd(m,unit)) return null;
  var r=PLF.units.toStd(m,unit,v); return (r==null||isNaN(r))?null:{val:r};
}
function matchKey(k,label){
  if(k && D.tests[k]) return k;
  var s=faDigits(label).toLowerCase().replace(/[^a-z0-9؀-ۿ ]/g," ").replace(/\s+/g," ").trim();
  if(!s) return "";
  var keys=Object.keys(D.tests),i,m;
  for(i=0;i<keys.length;i++){ m=D.tests[keys[i]];
    if(s===keys[i]||s===m.en.toLowerCase()||s===m.fa) return keys[i]; }
  for(i=0;i<keys.length;i++){
    m=D.tests[keys[i]];
    var en=m.en.toLowerCase(), en2=en.replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
    if(en2.length>2 && (s.indexOf(en2)>=0 || en2.indexOf(s)>=0)) return keys[i];
    if(m.fa.length>1 && s.indexOf(m.fa)>=0) return keys[i];
  }
  return "";
}
var _toastEl=null;
function toast(msg, actionLabel, actionFn){
  if(_toastEl){ _toastEl.remove(); _toastEl=null; }
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;"+
    "display:flex;align-items:center;gap:12px;max-width:90vw;"+
    "background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:10px;"+
    "font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.28)";
  var span=document.createElement("span"); span.textContent=msg; d.appendChild(span);
  var ttl=2800;
  if(actionLabel && actionFn){
    ttl=9000;
    var b=document.createElement("button");
    b.textContent=actionLabel;
    b.style.cssText="border:1px solid currentColor;background:transparent;color:inherit;"+
      "border-radius:7px;padding:3px 10px;font:inherit;font-size:.8rem;cursor:pointer;flex:0 0 auto";
    b.onclick=function(){ d.remove(); _toastEl=null; actionFn(); };
    d.appendChild(b);
  }
  document.body.appendChild(d); _toastEl=d;
  setTimeout(function(){ if(_toastEl===d){ d.remove(); _toastEl=null; } }, ttl);
}

var pendingRows=[], reviewOnClose=null, reviewProgress="", photoBatch=[];

  var cb=reviewOnClose; reviewOnClose=null; if(cb) cb();
}
function baseReportAt(g){
  for(var i=0;i<S.length;i++){ if(S[i].g===g && !S[i].mine) return S[i]; }
  return null;
}
function updatePhotoUndo(){

function undoPhotoBatch(){
  if(!photoBatch.length) return;
  var set=photoBatch; photoBatch=[];
  additions = additions.filter(function(a){ return set.indexOf(a)<0; });
  saveAdd(); updatePhotoUndo();

function openReview(data, onClose){
  reviewOnClose = onClose || null;
  var items=(data&&data.items)||[];
  if(!items.length){
    alert(t("مقدار عددی‌ای پیدا نشد","No numeric values found"));
    fireReviewClose(); return;
  }
  var jd=data.jalali||"", gd=data.gregorian||"";
  if(jd && !gd) gd=jStrToG(jd);
  if(gd && !jd) jd=gStrToJ(gd);
  document.getElementById("rev-j").value=jd;
  document.getElementById("rev-g").value=gd;
  document.getElementById("rev-note").textContent = (reviewProgress? reviewProgress+"  ":"") +
    t("تاریخ برگه را بررسی کنید؛ فقط موارد درست را تیک بزنید.",
      "Check the report date; keep only the correct items ticked.");
  var host=document.getElementById("rev-rows"); host.innerHTML="";
  var groupedOpts = D.cats.map(function(cat){
    var ks=Object.keys(D.tests).filter(function(k){ return D.tests[k].cat===cat.k; });
    if(!ks.length) return "";
    return '<optgroup label="'+esc(t(cat.fa,cat.en))+'">'+ks.map(function(k){
      return '<option value="'+k+'">'+esc(t(D.tests[k].fa,D.tests[k].en))+
        (D.tests[k].unit?" ["+esc(D.tests[k].unit)+"]":"")+'</option>'; }).join("")+'</optgroup>';
  }).join("");
  pendingRows=items.map(function(it){
    var gk=matchKey(it.key,it.label||"");
    var row=document.createElement("div"); row.className="revrow";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!gk;
    var sel=document.createElement("select");
    sel.innerHTML='<option value="">— '+t("نادیده بگیر","ignore")+' —</option>'+
      (it.label?'<option value="__new__">＋ '+esc(t("آزمایش جدید با این نام","New test from this label"))+'</option>':'')+groupedOpts;
    if(gk) sel.value=gk;
    var val=document.createElement("input"); val.type="number"; val.step="any";
    var nv=parseFloat(faDigits(it.value));
    var cv = isNaN(nv) ? null : convertExtracted(it.unit, gk, nv);   // unit homogenisation
    var factor = !!cv;
    val.value=isNaN(nv)?"":(cv?PLF.units.fmt(cv.val):nv);
    function sync(){ row.classList.toggle("skip", !cb.checked || !sel.value); }
    cb.addEventListener("change",sync);
    sel.addEventListener("change",function(){ if(sel.value) cb.checked=true; sync(); });
    row.appendChild(cb); row.appendChild(sel); row.appendChild(val);
    var note=document.createElement("div");
    note.style.cssText="grid-column:2/4;margin:0;font-size:.68rem;color:var(--muted)";
    var bits=[];
    if(it.label) bits.push(faDigits(it.label));
    var want = gk && D.tests[gk].unit;
    if(it.unit && want && normU(it.unit)!==normU(want)){
      bits.push((factor
        ? t("واحد از "+it.unit+" به "+want+" تبدیل شد","unit "+it.unit+" → "+want)
        : t("⚠ واحد ("+it.unit+") با واحد کاتالوگ ("+want+") فرق دارد — بررسی کنید",
             "⚠ unit ("+it.unit+") differs from catalog ("+want+") — check")));
      if(!factor) cb.checked=false;
    } else if(it.unit) bits.push(it.unit);
    note.textContent=bits.join("  ·  ");
    if(bits.length) row.appendChild(note);
    sync(); host.appendChild(row);
    return {cb:cb, sel:sel, val:val, it:it};
  });
  document.getElementById("rev").showModal();
}

document.getElementById("rev-ok").onclick=function(){
  var jd=faDigits(document.getElementById("rev-j").value.trim());

  if(!gd && jd) gd=jStrToG(jd);
  if(!gd){ alert(t("تاریخ میلادی معتبر وارد کنید","Enter a valid gregorian date")); return; }
  if(!jd && gd) jd=gStrToJ(gd);
  var chosen=[];

    if(key==="__new__"){                                 // dynamic analyte: define it on the fly
      var lbl=faDigits(r.it.label||"").trim();
      key=createCustomTest({fa:lbl, en:lbl, unit:r.it.unit||""}); if(!key) return;
    }
    chosen.push({key:key, val:v});
  });
  var base=baseReportAt(gd);
  if(base && chosen.some(function(c){ return base.v[c.key]!=null && base.v[c.key]!==c.val; })){
    if(!confirm(t("این تاریخ با یک برگهٔ اصلی («"+base.j+"») یکی است و بعضی مقادیر آن بازنویسی می‌شود. ادامه؟",
                  "This date matches an original report (\""+base.j+"\") and some of its values will be overwritten. Continue?")))
      return;
  }
  chosen.forEach(function(c){
    var a={j:jd||gd, g:gd, key:c.key, val:c.val, src:"photo"};
    additions.push(a); photoBatch.push(a);
  });
  if(chosen.length) saveAdd();
  else toast(t("موردی انتخاب نشد","Nothing selected"));
  closeReview();
};

function runCapture(files){
  files = files && files.length ? Array.prototype.slice.call(files) : [];
  if(!files.length) return;
  if(!gKey()){ document.getElementById("cap-nokey").hidden=false; return; }
  photoBatch=[];
  processCapture(files, 0);
}
function processCapture(queue, i){
  var st=document.getElementById("cap-status");
  if(i>=queue.length){
    st.hidden=true; reviewProgress="";
    if(panelOn("add")) showTab("table");
    updatePhotoUndo();
    if(photoBatch.length){
      var dates={}; photoBatch.forEach(function(a){ dates[a.j||a.g]=1; });
      toast(t("‏"+photoBatch.length+" مقدار از عکس افزوده شد ("+Object.keys(dates).length+" تاریخ)",
              photoBatch.length+" values added from photo ("+Object.keys(dates).length+" date(s))"),
            t("بازگرداندن","Undo"), undoPhotoBatch);
    }
    return;
  }
  reviewProgress = queue.length>1 ? "("+(i+1)+"/"+queue.length+")" : "";
  st.hidden=false;
  st.textContent=t("در حال خواندن…","Reading…")+(queue.length>1?" "+(i+1)+"/"+queue.length:"");
  geminiExtract([queue[i]]).then(function(data){
    st.hidden=true;
    openReview(data, function(){ processCapture(queue, i+1); });
  }).catch(function(err){
    st.hidden=true;
    if(String(err&&err.message)==="nokey"){ document.getElementById("cap-nokey").hidden=false; return; }
    var failed=queue[i];
    toast(t("خطا: ","Error: ")+(err&&err.message||err),
          t("تلاش دوباره","Retry"), function(){ photoBatch=[]; processCapture([failed],0); });
    processCapture(queue, i+1);      // move on; Retry re-runs just this file
  });
}
